# SPDX-License-Identifier: GPL-3.0-or-later
name: Runner Monitor 1.2.35 visual recovery v2

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/runner-monitor-135-visual-recovery-v2.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source and Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify current Common baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < infiltratr-common/VERSION)" = "1.19.38"
          test "$(git ls-tree HEAD infiltratr-common | awk '{print $3}')" = "7070c5812b50821fd7580101cb2289a3184f6b2c"
          test "$(git ls-remote https://github.com/Infiltrator-Projects/Infiltrator-Libraries.git refs/heads/main | awk '{print $1}')" = "7070c5812b50821fd7580101cb2289a3184f6b2c"

      - name: Apply graphical recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/runner_monitor_visual_recovery_135.py

      - name: Build and qualify recovered UI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          ./build/runnerscope --self-test
          test "$(./build/runnerscope --version)" = "1.2.35"
          test "$(./build/runnerscope --common-version)" = "1.19.38"

      - name: Publish qualified release source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add src/linux_main.c VERSION CHANGELOG.md debian/changelog
          git commit -m "Release 1.2.35: restore graphical Infiltrator OS hierarchy"
          git push origin HEAD:main
