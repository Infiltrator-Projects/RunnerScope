name: Release RunnerScope v1.0.3 rich monitor

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Release RunnerScope v1.0.3 rich monitor restoration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore rich cross-platform RunnerScope source
        shell: bash
        run: |
          set -euo pipefail
          cat .v103-part00 .v103-part01 .v103-part02 .v103-part03 .v103-part04 | base64 -d | gzip -dc > /tmp/runnerscope.py
          echo 'b4cf4a9bbd3c4e5f0a445ae866ac935f680a090f4496f2869793630ecdf91b5a  /tmp/runnerscope.py' | sha256sum -c -
          mv /tmp/runnerscope.py runnerscope.py
          rm -f .v103-payload.gz.b64 .v103-part00 .v103-part01 .v103-part02 .v103-part03 .v103-part04
          rm -f .release-v103-trigger .release-v103-trigger-retry
          rm -f .github/workflows/release-v103-rich-monitor.yml

      - name: Install GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Compile, self-test, and verify restored rich monitor
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile runnerscope.py
          python3 runnerscope.py --self-test
          grep -Fq '"state_for", "State for"' runnerscope.py
          grep -Fq '"busy_pct", "Busy"' runnerscope.py
          grep -Fq 'GitHub reports runner busy' runnerscope.py
          grep -Fq 'concurrent.futures.ThreadPoolExecutor' runnerscope.py
          xvfb-run -a python3 - <<'PY'
          import tkinter as tk
          import runnerscope as r
          root = tk.Tk()
          root.withdraw()
          cfg = dict(r.DEFAULT_CONFIG)
          cfg['organisation'] = 'example-org'
          dialog = r.ConfigDialog(root, cfg)
          dialog.update_idletasks()
          dialog.update()
          assert dialog.winfo_viewable(), 'first-run configuration dialog is not visible'
          assert dialog.cget('background') == r.MB_BG, 'configuration dialog theme is not graphite'
          dialog.destroy()
          root.destroy()
          print('GUI setup smoke test passed')
          PY

      - name: Update changelog and commit clean source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          old = path.read_text(encoding='utf-8') if path.exists() else '# Changelog\n\n'
          entry = '''## 1.0.3\n\n- Restores the full rich runner monitor UI/data model from the proven Windows baseline.\n- Restores State for, session job count, busy percentage, resolving busy-runner state, detailed session summaries, sortable columns and clickable counters.\n- Keeps the fast 2-second runner-state poll and immediately requests job resolution when a runner becomes busy.\n- Uses the graphite/silver theme consistently in setup, settings and the main monitor.\n- Keeps one shared Windows/Linux code path while adding Linux local service health and restart support.\n- Keeps organisation, runner names and credentials out of the published source.\n\n'''
          if not old.startswith('# Changelog'):
              old = '# Changelog\n\n' + old
          if '## 1.0.3' not in old:
              head, rest = old.split('\n', 1)
              path.write_text(head + '\n\n' + entry + rest.lstrip('\n'), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore rich runner monitor UI and data; bump v1.0.3'
          git push origin HEAD:main
          echo "PATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build direct Python downloads and Debian package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp runnerscope.py dist/RunnerScope-Windows-v1.0.3.py
          cp runnerscope.py dist/RunnerScope-Linux-v1.0.3.py
          ROOT="$RUNNER_TEMP/runnerscope-deb"
          PKG="$ROOT/runnerscope_1.0.3-1_all"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/usr/lib/runnerscope" "$PKG/usr/share/applications" "$PKG/usr/share/doc/runnerscope"
          cat > "$PKG/DEBIAN/control" <<'EOF'
          Package: runnerscope
          Version: 1.0.3-1
          Section: devel
          Priority: optional
          Architecture: all
          Depends: python3 (>= 3.10), python3-tk, gh
          Maintainer: Shannon Smith <noreply@github.com>
          Homepage: https://github.com/Infiltrator-Projects/RunnerScope
          Description: Cross-platform GitHub Actions self-hosted runner monitor
           RunnerScope monitors runner state, active jobs, history, utilisation,
           and local runner service health from a desktop GUI.
          EOF
          install -m 0644 runnerscope.py "$PKG/usr/lib/runnerscope/runnerscope.py"
          install -m 0644 README.md "$PKG/usr/share/doc/runnerscope/README.md"
          install -m 0644 LICENSE "$PKG/usr/share/doc/runnerscope/copyright"
          cat > "$PKG/usr/bin/runnerscope" <<'EOF'
          #!/bin/sh
          exec python3 /usr/lib/runnerscope/runnerscope.py "$@"
          EOF
          chmod 0755 "$PKG/usr/bin/runnerscope"
          cat > "$PKG/usr/share/applications/runnerscope.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=RunnerScope
          Comment=Monitor GitHub Actions self-hosted runners
          Exec=runnerscope
          Icon=utilities-system-monitor
          Terminal=false
          Categories=Development;System;Monitor;
          EOF
          dpkg-deb --build --root-owner-group "$PKG" "dist/runnerscope_1.0.3-1_all.deb"
          dpkg-deb --info dist/runnerscope_1.0.3-1_all.deb
          dpkg-deb --contents dist/runnerscope_1.0.3-1_all.deb
          sha256sum dist/RunnerScope-Windows-v1.0.3.py dist/RunnerScope-Linux-v1.0.3.py dist/runnerscope_1.0.3-1_all.deb > dist/SHA256SUMS.txt

      - name: Publish RunnerScope v1.0.3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          RunnerScope 1.0.3

          Rich monitor restoration and cross-platform consolidation.

          This release restores the useful data and responsiveness of the proven original Windows runner monitor instead of the simplified v1.0.1/v1.0.2 table design:
          - fast runner state polling (2 seconds by default)
          - immediate job-resolution scan when a runner changes to busy
          - State for, Jobs this session and Busy % columns
          - Resolving… / GitHub reports runner busy feedback while job details are being mapped
          - detailed runner, active-job and session summaries
          - sortable columns, clickable status counters, selection details and keyboard shortcuts
          - graphite/silver interface across setup, settings and the main monitor
          - the same shared Python implementation for Windows and Linux
          - local runner service health/restart support on both Windows and Linux
          - local configuration only; no user organisation, runner names or GitHub token embedded in source

          Downloads:
          - RunnerScope-Windows-v1.0.3.py — direct Windows Python script
          - RunnerScope-Linux-v1.0.3.py — direct Linux Python script
          - runnerscope_1.0.3-1_all.deb — optional Debian/Ubuntu/Linux Mint package
          - SHA256SUMS.txt — release checksums
          EOF
          gh release create v1.0.3 --target "$PATCH_SHA" --title 'RunnerScope 1.0.3' --notes-file /tmp/release-notes.md dist/RunnerScope-Windows-v1.0.3.py dist/RunnerScope-Linux-v1.0.3.py dist/runnerscope_1.0.3-1_all.deb dist/SHA256SUMS.txt
