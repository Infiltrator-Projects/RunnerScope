# SPDX-License-Identifier: GPL-3.0-or-later
name: RunnerScope Release

on:
  workflow_run:
    workflows: ["RunnerScope CI"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release RunnerScope ')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Download exact qualified Debian package
        uses: actions/download-artifact@v4
        with:
          name: runnerscope-deb
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Prepare checksums
        run: |
          test "$(tr -d '[:space:]' < VERSION)" = "1.2.0"
          (cd dist && sha256sum runnerscope_1.2.0_*.deb > SHA256SUMS.txt)

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v1.2.0
          ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          gh release create "$tag"             dist/runnerscope_1.2.0_*.deb dist/SHA256SUMS.txt             --repo "$GITHUB_REPOSITORY"             --target "${{ github.event.workflow_run.head_sha }}"             --title "RunnerScope 1.2.0"             --notes "Native C/GTK RunnerScope. Python/Tkinter have been removed from the Linux runtime package. Infiltratr Common 1.19.2 is linked directly and GitHub CLI remains the credential boundary."             --latest
