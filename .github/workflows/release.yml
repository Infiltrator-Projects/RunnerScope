# SPDX-License-Identifier: GPL-3.0-or-later
name: Runner Monitor Release

on:
  workflow_run:
    workflows: ["Runner Monitor CI"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    # Publish only an exact, successful main-branch release commit.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact tested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Download exact tested Debian package
        uses: actions/download-artifact@v4
        with:
          name: runnerscope-deb
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Prepare immutable release assets
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          deb="$(find dist -maxdepth 1 -name "runnerscope_${version}_*.deb" -print -quit)"
          test -n "$deb"
          cp runnerscope.py "dist/Runner-Monitor-Windows-v${version}.py"
          cp runnerscope.py "dist/Runner-Monitor-Linux-v${version}.py"
          (
            cd dist
            sha256sum "runnerscope_${version}_amd64.deb" \
              "Runner-Monitor-Windows-v${version}.py" \
              "Runner-Monitor-Linux-v${version}.py" > SHA256SUMS.txt
          )

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Published releases are immutable: $tag already exists." >&2
            exit 1
          fi
          gh release create "$tag" \
            "dist/runnerscope_${version}_amd64.deb" \
            "dist/Runner-Monitor-Windows-v${version}.py" \
            "dist/Runner-Monitor-Linux-v${version}.py" \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "Runner Monitor ${version}" \
            --generate-notes \
            --latest
