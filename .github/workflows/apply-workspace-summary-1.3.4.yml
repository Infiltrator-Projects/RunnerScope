name: Apply workspace summary renderer migration

on:
  push:
    branches:
      - migration/ui-workspace-summary-1.3.4

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Seed workspace summary renderer migration'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: migration/ui-workspace-summary-1.3.4
          fetch-depth: 0

      - name: Apply shared workspace summary slice
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          # Shared renderer contract.
          replace_once(
              'src/ui/ui_renderer.h',
              '''typedef struct {\n    const char *status_text;\n    const char *app_version;\n    const char *common_version;\n    bool refreshing;\n} RunnerUiFooterState;\n''',
              '''typedef struct {\n    const char *status_text;\n    const char *app_version;\n    const char *common_version;\n    bool refreshing;\n} RunnerUiFooterState;\n\ntypedef struct {\n    RunnerUiPageId page;\n    const char *metric_values[4];\n} RunnerUiWorkspaceSummaryState;\n''')

          replace_once(
              'src/ui/ui_renderer.h',
              '''    bool (*end_navigation)(void *context);\n\n    bool (*begin_footer)(void *context);\n''',
              '''    bool (*end_navigation)(void *context);\n\n    bool (*begin_workspace_summary)(void *context,\n                                    const RunnerUiPageSpec *page,\n                                    const char *platform_title);\n    bool (*workspace_metric)(void *context,\n                             size_t index,\n                             const char *caption,\n                             const char *value);\n    bool (*end_workspace_summary)(void *context);\n\n    bool (*begin_footer)(void *context);\n''')

          replace_once(
              'src/ui/ui_renderer.h',
              '''bool runner_ui_render_navigation(const RunnerUiRenderer *renderer,\n                                 RunnerUiPlatform platform,\n                                 RunnerUiPageId selected_page);\nbool runner_ui_render_footer''',
              '''bool runner_ui_render_navigation(const RunnerUiRenderer *renderer,\n                                 RunnerUiPlatform platform,\n                                 RunnerUiPageId selected_page);\nbool runner_ui_render_workspace_summary(\n    const RunnerUiRenderer *renderer,\n    RunnerUiPlatform platform,\n    const RunnerUiWorkspaceSummaryState *state);\nbool runner_ui_render_footer''')

          replace_once(
              'src/ui/ui_renderer.c',
              '''    return renderer->end_navigation(renderer->context);\n}\n\nbool runner_ui_render_footer''',
              '''    return renderer->end_navigation(renderer->context);\n}\n\nbool runner_ui_render_workspace_summary(\n    const RunnerUiRenderer *renderer,\n    RunnerUiPlatform platform,\n    const RunnerUiWorkspaceSummaryState *state)\n{\n    if (!renderer || !renderer->begin_workspace_summary ||\n        !renderer->workspace_metric || !renderer->end_workspace_summary ||\n        !state || (int)state->page < 0 || state->page >= RUNNER_UI_PAGE_COUNT ||\n        (platform != RUNNER_UI_PLATFORM_LINUX &&\n         platform != RUNNER_UI_PLATFORM_WINDOWS))\n        return false;\n\n    for (size_t i = 0U; i < 4U; ++i)\n        if (!state->metric_values[i]) return false;\n\n    const RunnerUiPageSpec *page = runner_ui_page(state->page);\n    const char *platform_title = runner_ui_page_title(page, platform);\n    if (!platform_title || !platform_title[0]) return false;\n    if (!renderer->begin_workspace_summary(\n            renderer->context, page, platform_title))\n        return false;\n\n    for (size_t i = 0U; i < 4U; ++i)\n        if (!renderer->workspace_metric(\n                renderer->context, i, page->metric_labels[i],\n                state->metric_values[i]))\n            return false;\n\n    return renderer->end_workspace_summary(renderer->context);\n}\n\nbool runner_ui_render_footer''')

          # GTK renderer adapter: move workspace identity/metric composition behind the seam.
          replace_once(
              'src/linux_main.c',
              '''static void workspace_metric(RunnerScopeApp *app, guint index,\n                             const char *caption, const char *value)\n{\n    if (!app || index >= 4U || !app->workspace_metric_caption[index] ||\n        !app->workspace_metric_value[index])\n        return;\n    label_set_if_changed(\n        app->workspace_metric_caption[index], caption ? caption : "—");\n    label_set_if_changed(\n        app->workspace_metric_value[index], value ? value : "—");\n}\n''',
              '''typedef struct {\n    RunnerScopeApp *app;\n    GtkWidget *workspace;\n    guint compact_spacing;\n    guint control_spacing;\n} GtkWorkspaceRendererContext;\n\nstatic bool gtk_renderer_begin_workspace_summary(\n    void *context, const RunnerUiPageSpec *page, const char *platform_title)\n{\n    GtkWorkspaceRendererContext *renderer = context;\n    if (!renderer || !renderer->app || !page || !platform_title) return false;\n    RunnerScopeApp *app = renderer->app;\n\n    if (app->workspace_title && app->workspace_subtitle &&\n        app->workspace_icon && app->workspace_art) {\n        runner_asset_image_set(app->workspace_icon, page->nav_asset, 48, 48);\n        runner_asset_image_set(app->workspace_art, page->hero_asset, 240, 86);\n        label_set_if_changed(app->workspace_title, platform_title);\n        label_set_if_changed(app->workspace_subtitle, page->subtitle);\n        return true;\n    }\n    if (!renderer->workspace) return false;\n\n    GtkWidget *workspace_header = gtk_box_new(\n        GTK_ORIENTATION_HORIZONTAL, (gint)renderer->control_spacing);\n    gtk_style_context_add_class(\n        gtk_widget_get_style_context(workspace_header), "workspace-header");\n    gtk_box_pack_start(\n        GTK_BOX(renderer->workspace), workspace_header, FALSE, FALSE, 0);\n\n    GtkWidget *workspace_icon_well = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 0);\n    gtk_style_context_add_class(\n        gtk_widget_get_style_context(workspace_icon_well), "workspace-icon-well");\n    app->workspace_icon = runner_asset_image_new(page->nav_asset, 48, 48);\n    gtk_style_context_add_class(\n        gtk_widget_get_style_context(app->workspace_icon), "workspace-icon");\n    gtk_box_pack_start(\n        GTK_BOX(workspace_icon_well), app->workspace_icon, TRUE, TRUE, 0);\n    gtk_box_pack_start(\n        GTK_BOX(workspace_header), workspace_icon_well, FALSE, FALSE, 0);\n\n    GtkWidget *workspace_copy = gtk_box_new(GTK_ORIENTATION_VERTICAL, 2);\n    gtk_widget_set_hexpand(workspace_copy, TRUE);\n    app->workspace_title = gtk_label_new(platform_title);\n    gtk_label_set_ellipsize(\n        GTK_LABEL(app->workspace_title), PANGO_ELLIPSIZE_END);\n    app->workspace_subtitle = gtk_label_new(page->subtitle);\n    gtk_style_context_add_class(\n        gtk_widget_get_style_context(app->workspace_title), "workspace-title");\n    gtk_style_context_add_class(\n        gtk_widget_get_style_context(app->workspace_subtitle), "workspace-subtitle");\n    gtk_widget_set_halign(app->workspace_title, GTK_ALIGN_START);\n    gtk_widget_set_halign(app->workspace_subtitle, GTK_ALIGN_START);\n    gtk_label_set_ellipsize(\n        GTK_LABEL(app->workspace_subtitle), PANGO_ELLIPSIZE_END);\n    gtk_box_pack_start(\n        GTK_BOX(workspace_copy), app->workspace_title, FALSE, FALSE, 0);\n    gtk_box_pack_start(\n        GTK_BOX(workspace_copy), app->workspace_subtitle, FALSE, FALSE, 0);\n    gtk_box_pack_start(\n        GTK_BOX(workspace_header), workspace_copy, TRUE, TRUE, 0);\n\n    GtkWidget *workspace_art_frame = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 0);\n    app->workspace_art_frame = workspace_art_frame;\n    gtk_widget_set_no_show_all(workspace_art_frame, TRUE);\n    gtk_style_context_add_class(\n        gtk_widget_get_style_context(workspace_art_frame), "workspace-art-frame");\n    app->workspace_art = runner_asset_image_new(page->hero_asset, 240, 86);\n    gtk_box_pack_start(\n        GTK_BOX(workspace_art_frame), app->workspace_art, TRUE, TRUE, 0);\n    gtk_box_pack_start(\n        GTK_BOX(workspace_header), workspace_art_frame, FALSE, FALSE, 0);\n\n    GtkWidget *workspace_metrics = gtk_grid_new();\n    gtk_grid_set_column_spacing(\n        GTK_GRID(workspace_metrics), renderer->compact_spacing);\n    gtk_grid_set_column_homogeneous(GTK_GRID(workspace_metrics), TRUE);\n    const char *metric_classes[] = {\n        "metric-one", "metric-two", "metric-three", "metric-four"\n    };\n    for (guint i = 0U; i < 4U; ++i) {\n        GtkWidget *metric = make_workspace_metric(\n            "—", &app->workspace_metric_caption[i],\n            &app->workspace_metric_value[i]);\n        gtk_style_context_add_class(\n            gtk_widget_get_style_context(metric), metric_classes[i]);\n        gtk_grid_attach(\n            GTK_GRID(workspace_metrics), metric, (gint)i, 0, 1, 1);\n    }\n    gtk_box_pack_end(\n        GTK_BOX(workspace_header), workspace_metrics, FALSE, FALSE, 0);\n    return true;\n}\n\nstatic bool gtk_renderer_workspace_metric(void *context, size_t index,\n                                          const char *caption,\n                                          const char *value)\n{\n    GtkWorkspaceRendererContext *renderer = context;\n    if (!renderer || !renderer->app || index >= 4U || !caption || !value)\n        return false;\n    RunnerScopeApp *app = renderer->app;\n    if (!app->workspace_metric_caption[index] ||\n        !app->workspace_metric_value[index])\n        return false;\n    label_set_if_changed(app->workspace_metric_caption[index], caption);\n    label_set_if_changed(app->workspace_metric_value[index], value);\n    return true;\n}\n\nstatic bool gtk_renderer_end_workspace_summary(void *context)\n{\n    return context != NULL;\n}\n''')

          old_update = '''static void update_workspace_context(RunnerScopeApp *app, gint page)\n{\n    if (!app || !app->workspace_title || !app->workspace_subtitle) return;\n\n    const RunnerUiPageSpec *ui_page = runner_ui_page((RunnerUiPageId)page);\n    runner_asset_image_set(app->workspace_icon, ui_page->nav_asset, 48, 48);\n    runner_asset_image_set(app->workspace_art, ui_page->hero_asset, 240, 86);\n    label_set_if_changed(\n        app->workspace_title,\n        runner_ui_page_title(ui_page, RUNNER_UI_PLATFORM_LINUX));\n    label_set_if_changed(app->workspace_subtitle, ui_page->subtitle);\n\n    char a[32], b[32], d[32], uptime[64];\n    switch (page) {\n        case 0:\n            g_snprintf(a, sizeof(a), "%u", app->runners_total);\n            g_snprintf(b, sizeof(b), "%u", app->runners_running);\n            g_snprintf(d, sizeof(d), "%u", app->runners_idle);\n            workspace_metric(app, 0U, ui_page->metric_labels[0], a);\n            workspace_metric(app, 1U, ui_page->metric_labels[1], b);\n            workspace_metric(app, 2U, ui_page->metric_labels[2], d);\n            g_snprintf(a, sizeof(a), "%u", app->runners_offline);\n            workspace_metric(app, 3U, ui_page->metric_labels[3], a);\n            break;\n        case 1:\n            g_snprintf(a, sizeof(a), "%u", app->local_active);\n            g_snprintf(b, sizeof(b), "%u", app->hosted_active);\n            g_snprintf(d, sizeof(d), "%u", app->queued);\n            workspace_metric(app, 0U, ui_page->metric_labels[0], a);\n            workspace_metric(app, 1U, ui_page->metric_labels[1], b);\n            workspace_metric(app, 2U, ui_page->metric_labels[2], d);\n            g_snprintf(a, sizeof(a), "%u", app->local_active + app->hosted_active);\n            workspace_metric(app, 3U, ui_page->metric_labels[3], a);\n            break;\n        case 2: {\n            g_snprintf(a, sizeof(a), "%u", app->history_rows->len);\n            g_snprintf(b, sizeof(b), "%u", g_hash_table_size(app->sessions));\n            const char *filter = gtk_entry_get_text(GTK_ENTRY(app->filter_entry));\n            char *uptime_text =\n                duration_text(now_monotonic() - app->session_started);\n            g_strlcpy(uptime, uptime_text ? uptime_text : "—", sizeof(uptime));\n            g_free(uptime_text);\n            workspace_metric(app, 0U, ui_page->metric_labels[0], a);\n            workspace_metric(app, 1U, ui_page->metric_labels[1], b);\n            workspace_metric(app, 2U, ui_page->metric_labels[2], uptime);\n            workspace_metric(app, 3U, ui_page->metric_labels[3], filter && *filter ? "ACTIVE" : "ALL");\n            break;\n        }\n        default:\n            g_snprintf(a, sizeof(a), "%u", app->local_rows->len);\n            g_snprintf(b, sizeof(b), "%u", count_local_state(app, "RUNNING"));\n            g_snprintf(d, sizeof(d), "%u", count_local_github(app));\n            workspace_metric(app, 0U, ui_page->metric_labels[0], a);\n            workspace_metric(app, 1U, ui_page->metric_labels[1], b);\n            workspace_metric(app, 2U, ui_page->metric_labels[2], d);\n            g_snprintf(a, sizeof(a), "%u", count_local_diagnostics(app));\n            workspace_metric(app, 3U, ui_page->metric_labels[3], a);\n            break;\n    }\n\n    if (app->open_job_button)\n        gtk_widget_set_visible(\n            app->open_job_button,\n            (ui_page->actions & RUNNER_UI_ACTION_OPEN_JOB) != 0U);\n    if (app->open_diag_button)\n        gtk_widget_set_visible(\n            app->open_diag_button,\n            (ui_page->actions & RUNNER_UI_ACTION_OPEN_DIAGNOSTIC) != 0U);\n    if (app->restart_button)\n        gtk_widget_set_visible(\n            app->restart_button,\n            (ui_page->actions & RUNNER_UI_ACTION_RESTART_RUNNER) != 0U);\n    if (app->runner_view_switch)\n        gtk_widget_set_visible(app->runner_view_switch, ui_page->show_view_switch);\n}\n'''
          new_update = '''static void update_workspace_context(RunnerScopeApp *app, gint page)\n{\n    if (!app || page < 0 || page >= RUNNER_UI_PAGE_COUNT) return;\n\n    char metric_values[4][64] = {{0}};\n    switch (page) {\n        case RUNNER_UI_PAGE_RUNNERS:\n            g_snprintf(metric_values[0], sizeof(metric_values[0]), "%u", app->runners_total);\n            g_snprintf(metric_values[1], sizeof(metric_values[1]), "%u", app->runners_running);\n            g_snprintf(metric_values[2], sizeof(metric_values[2]), "%u", app->runners_idle);\n            g_snprintf(metric_values[3], sizeof(metric_values[3]), "%u", app->runners_offline);\n            break;\n        case RUNNER_UI_PAGE_ACTIVE_JOBS:\n            g_snprintf(metric_values[0], sizeof(metric_values[0]), "%u", app->local_active);\n            g_snprintf(metric_values[1], sizeof(metric_values[1]), "%u", app->hosted_active);\n            g_snprintf(metric_values[2], sizeof(metric_values[2]), "%u", app->queued);\n            g_snprintf(metric_values[3], sizeof(metric_values[3]), "%u",\n                       app->local_active + app->hosted_active);\n            break;\n        case RUNNER_UI_PAGE_HISTORY: {\n            g_snprintf(metric_values[0], sizeof(metric_values[0]), "%u",\n                       app->history_rows->len);\n            g_snprintf(metric_values[1], sizeof(metric_values[1]), "%u",\n                       g_hash_table_size(app->sessions));\n            char *uptime_text = duration_text(\n                now_monotonic() - app->session_started);\n            g_strlcpy(metric_values[2], uptime_text ? uptime_text : "—",\n                      sizeof(metric_values[2]));\n            g_free(uptime_text);\n            const char *filter =\n                gtk_entry_get_text(GTK_ENTRY(app->filter_entry));\n            g_strlcpy(metric_values[3], filter && *filter ? "ACTIVE" : "ALL",\n                      sizeof(metric_values[3]));\n            break;\n        }\n        case RUNNER_UI_PAGE_LOCAL_HEALTH:\n            g_snprintf(metric_values[0], sizeof(metric_values[0]), "%u",\n                       app->local_rows->len);\n            g_snprintf(metric_values[1], sizeof(metric_values[1]), "%u",\n                       count_local_state(app, "RUNNING"));\n            g_snprintf(metric_values[2], sizeof(metric_values[2]), "%u",\n                       count_local_github(app));\n            g_snprintf(metric_values[3], sizeof(metric_values[3]), "%u",\n                       count_local_diagnostics(app));\n            break;\n        default:\n            return;\n    }\n\n    RunnerUiWorkspaceSummaryState summary = {\n        (RunnerUiPageId)page,\n        {metric_values[0], metric_values[1], metric_values[2], metric_values[3]}\n    };\n    GtkWorkspaceRendererContext workspace_context = {0};\n    workspace_context.app = app;\n    RunnerUiRenderer workspace_renderer = {0};\n    workspace_renderer.context = &workspace_context;\n    workspace_renderer.begin_workspace_summary =\n        gtk_renderer_begin_workspace_summary;\n    workspace_renderer.workspace_metric = gtk_renderer_workspace_metric;\n    workspace_renderer.end_workspace_summary =\n        gtk_renderer_end_workspace_summary;\n    if (!runner_ui_render_workspace_summary(\n            &workspace_renderer, RUNNER_UI_PLATFORM_LINUX, &summary))\n        return;\n\n    const RunnerUiPageSpec *ui_page = runner_ui_page((RunnerUiPageId)page);\n    if (app->open_job_button)\n        gtk_widget_set_visible(\n            app->open_job_button,\n            (ui_page->actions & RUNNER_UI_ACTION_OPEN_JOB) != 0U);\n    if (app->open_diag_button)\n        gtk_widget_set_visible(\n            app->open_diag_button,\n            (ui_page->actions & RUNNER_UI_ACTION_OPEN_DIAGNOSTIC) != 0U);\n    if (app->restart_button)\n        gtk_widget_set_visible(\n            app->restart_button,\n            (ui_page->actions & RUNNER_UI_ACTION_RESTART_RUNNER) != 0U);\n    if (app->runner_view_switch)\n        gtk_widget_set_visible(app->runner_view_switch, ui_page->show_view_switch);\n}\n'''
          replace_once('src/linux_main.c', old_update, new_update)

          old_build = '''    GtkWidget *workspace_header = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, (gint)control_spacing);\n    gtk_style_context_add_class(\n        gtk_widget_get_style_context(workspace_header), "workspace-header");\n    gtk_box_pack_start(GTK_BOX(workspace), workspace_header, FALSE, FALSE, 0);\n\n    GtkWidget *workspace_icon_well = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 0);\n    gtk_style_context_add_class(\n        gtk_widget_get_style_context(workspace_icon_well), "workspace-icon-well");\n    app->workspace_icon = runner_asset_image_new(initial_page->nav_asset, 48, 48);\n    gtk_style_context_add_class(\n        gtk_widget_get_style_context(app->workspace_icon), "workspace-icon");\n    gtk_box_pack_start(\n        GTK_BOX(workspace_icon_well), app->workspace_icon, TRUE, TRUE, 0);\n    gtk_box_pack_start(\n        GTK_BOX(workspace_header), workspace_icon_well, FALSE, FALSE, 0);\n\n    GtkWidget *workspace_copy = gtk_box_new(GTK_ORIENTATION_VERTICAL, 2);\n    gtk_widget_set_hexpand(workspace_copy, TRUE);\n    app->workspace_title = gtk_label_new(\n        runner_ui_page_title(initial_page, RUNNER_UI_PLATFORM_LINUX));\n    gtk_label_set_ellipsize(GTK_LABEL(app->workspace_title), PANGO_ELLIPSIZE_END);\n    app->workspace_subtitle = gtk_label_new(initial_page->subtitle);\n    gtk_style_context_add_class(\n        gtk_widget_get_style_context(app->workspace_title), "workspace-title");\n    gtk_style_context_add_class(\n        gtk_widget_get_style_context(app->workspace_subtitle), "workspace-subtitle");\n    gtk_widget_set_halign(app->workspace_title, GTK_ALIGN_START);\n    gtk_widget_set_halign(app->workspace_subtitle, GTK_ALIGN_START);\n    gtk_label_set_ellipsize(\n        GTK_LABEL(app->workspace_subtitle), PANGO_ELLIPSIZE_END);\n    gtk_box_pack_start(\n        GTK_BOX(workspace_copy), app->workspace_title, FALSE, FALSE, 0);\n    gtk_box_pack_start(\n        GTK_BOX(workspace_copy), app->workspace_subtitle, FALSE, FALSE, 0);\n    gtk_box_pack_start(GTK_BOX(workspace_header), workspace_copy, TRUE, TRUE, 0);\n\n    GtkWidget *workspace_art_frame = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 0);\n    app->workspace_art_frame = workspace_art_frame;\n    gtk_widget_set_no_show_all(workspace_art_frame, TRUE);\n    gtk_style_context_add_class(\n        gtk_widget_get_style_context(workspace_art_frame), "workspace-art-frame");\n    app->workspace_art = runner_asset_image_new(initial_page->hero_asset, 240, 86);\n    gtk_box_pack_start(\n        GTK_BOX(workspace_art_frame), app->workspace_art, TRUE, TRUE, 0);\n    gtk_box_pack_start(\n        GTK_BOX(workspace_header), workspace_art_frame, FALSE, FALSE, 0);\n\n    GtkWidget *workspace_metrics = gtk_grid_new();\n    gtk_grid_set_column_spacing(GTK_GRID(workspace_metrics), compact_spacing);\n    gtk_grid_set_column_homogeneous(GTK_GRID(workspace_metrics), TRUE);\n    for (guint i = 0U; i < 4U; i++) {\n        GtkWidget *metric = make_workspace_metric(\n            "—", &app->workspace_metric_caption[i],\n            &app->workspace_metric_value[i]);\n        const char *metric_classes[] = {\n            "metric-one", "metric-two", "metric-three", "metric-four"\n        };\n        gtk_style_context_add_class(\n            gtk_widget_get_style_context(metric), metric_classes[i]);\n        gtk_grid_attach(GTK_GRID(workspace_metrics), metric, (gint)i, 0, 1, 1);\n    }\n    gtk_box_pack_end(\n        GTK_BOX(workspace_header), workspace_metrics, FALSE, FALSE, 0);\n'''
          new_build = '''    RunnerUiWorkspaceSummaryState initial_summary = {\n        RUNNER_UI_PAGE_RUNNERS, {"—", "—", "—", "—"}\n    };\n    GtkWorkspaceRendererContext workspace_context = {0};\n    workspace_context.app = app;\n    workspace_context.workspace = workspace;\n    workspace_context.compact_spacing = compact_spacing;\n    workspace_context.control_spacing = control_spacing;\n    RunnerUiRenderer workspace_renderer = {0};\n    workspace_renderer.context = &workspace_context;\n    workspace_renderer.begin_workspace_summary =\n        gtk_renderer_begin_workspace_summary;\n    workspace_renderer.workspace_metric = gtk_renderer_workspace_metric;\n    workspace_renderer.end_workspace_summary =\n        gtk_renderer_end_workspace_summary;\n    if (!runner_ui_render_workspace_summary(\n            &workspace_renderer, RUNNER_UI_PLATFORM_LINUX, &initial_summary))\n        g_error("Unable to render the shared workspace summary contract.");\n'''
          replace_once('src/linux_main.c', old_build, new_build)

          # Win32 renderer adapter: consume the same emitted workspace summary.
          replace_once(
              'src/windows_main.c',
              '''static const wchar_t *page_title(int page)\n{\n    static wchar_t value[128];\n    const RunnerUiPageSpec *ui_page =\n        runner_ui_page((RunnerUiPageId)page);\n    utf8_to_wide(\n        runner_ui_page_title(ui_page, RUNNER_UI_PLATFORM_WINDOWS),\n        value, sizeof(value) / sizeof(value[0]));\n    return value;\n}\n\nstatic const wchar_t *page_subtitle(int page)\n{\n    static wchar_t value[160];\n    const RunnerUiPageSpec *ui_page =\n        runner_ui_page((RunnerUiPageId)page);\n    utf8_to_wide(ui_page->subtitle, value, sizeof(value) / sizeof(value[0]));\n    return value;\n}\n\n''',
              '')

          old_win_workspace = '''static void draw_metrics(HDC dc, RECT header)\n{\n    size_t total = g_row_count, running = 0U, idle = 0U, offline = 0U;\n    for (size_t i = 0U; i < g_row_count; ++i) {\n        if (strcmp(g_rows[i].state, "RUNNING") == 0) running++;\n        else if (strcmp(g_rows[i].state, "IDLE") == 0) idle++;\n        else offline++;\n    }\n    const wchar_t *captions[4] = {L"TOTAL", L"RUNNING", L"IDLE", L"OFFLINE"};\n    size_t values[4] = {total, running, idle, offline};\n    int metric_w = sx(76);\n    int gap = sx(6);\n    int right = header.right - sx(8);\n    for (int i = 3; i >= 0; --i) {\n        RECT metric = {right - metric_w, header.top + sx(18),\n                       right, header.top + sx(82)};\n        fill_round_rect(dc, metric,\n                        mix_color(g_palette.surface_rgb, g_palette.neutral_accent_rgb,\n                                  i == 1 ? 12U : 5U),\n                        rgb(g_palette.border_rgb), sx(9));\n        wchar_t value[32];\n        _snwprintf_s(value, 32U, _TRUNCATE, L"%zu", values[i]);\n        RECT value_rect = {metric.left + sx(4), metric.top + sx(7),\n                           metric.right - sx(4), metric.top + sx(37)};\n        draw_text(dc, value, value_rect, g_font_title,\n                  rgb(g_palette.title_rgb), DT_CENTER | DT_VCENTER | DT_SINGLELINE);\n        RECT caption_rect = {metric.left + sx(3), metric.top + sx(38),\n                             metric.right - sx(3), metric.bottom - sx(5)};\n        draw_text(dc, captions[i], caption_rect, g_font_small,\n                  rgb(g_palette.muted_rgb), DT_CENTER | DT_VCENTER | DT_SINGLELINE);\n        right = metric.left - gap;\n    }\n}\n\nstatic void draw_workspace_header(HDC dc)\n{\n    RECT header = {g_workspace_rect.left, g_workspace_rect.top,\n                   g_workspace_rect.right, g_workspace_rect.top + sx(108)};\n    fill_round_rect(dc, header, rgb(g_palette.card_rgb),\n                    rgb(g_palette.connection_border_rgb), sx(12));\n\n    RECT icon_well = {header.left + sx(16), header.top + sx(17),\n                      header.left + sx(74), header.top + sx(75)};\n    fill_round_rect(dc, icon_well,\n                    mix_color(g_palette.surface_rgb, g_palette.neutral_accent_rgb, 11U),\n                    rgb(g_palette.neutral_accent_rgb), sx(11));\n    RECT icon = {icon_well.left + sx(5), icon_well.top + sx(5),\n                 icon_well.right - sx(5), icon_well.bottom - sx(5)};\n    draw_image(dc, &g_nav_images[g_page], &icon);\n\n    RECT title = {icon_well.right + sx(12), header.top + sx(16),\n                  header.left + sx(420), header.top + sx(47)};\n    draw_text(dc, page_title(g_page), title, g_font_brand,\n              rgb(g_palette.title_rgb), DT_LEFT | DT_VCENTER | DT_SINGLELINE | DT_END_ELLIPSIS);\n    RECT subtitle = {title.left, header.top + sx(50),\n                     header.left + sx(430), header.top + sx(73)};\n    draw_text(dc, page_subtitle(g_page), subtitle, g_font_small,\n              rgb(g_palette.kicker_rgb), DT_LEFT | DT_VCENTER | DT_SINGLELINE | DT_END_ELLIPSIS);\n\n    int metrics_width = sx(322);\n    RECT hero = {header.right - metrics_width - sx(258), header.top + sx(11),\n                 header.right - metrics_width - sx(18), header.top + sx(97)};\n    draw_image(dc, &g_hero_images[g_page], &hero);\n    draw_metrics(dc, header);\n}\n'''
          new_win_workspace = '''typedef struct {\n    HDC dc;\n    RECT header;\n} WinWorkspaceRendererContext;\n\nstatic bool win_renderer_begin_workspace_summary(\n    void *context, const RunnerUiPageSpec *page, const char *platform_title)\n{\n    WinWorkspaceRendererContext *renderer = context;\n    if (!renderer || !renderer->dc || !page || !platform_title) return false;\n    int page_index = (int)page->id;\n    if (page_index < 0 || page_index >= RUNNER_UI_PAGE_COUNT) return false;\n\n    renderer->header = (RECT){\n        g_workspace_rect.left, g_workspace_rect.top,\n        g_workspace_rect.right, g_workspace_rect.top + sx(108)\n    };\n    RECT header = renderer->header;\n    fill_round_rect(renderer->dc, header, rgb(g_palette.card_rgb),\n                    rgb(g_palette.connection_border_rgb), sx(12));\n\n    RECT icon_well = {header.left + sx(16), header.top + sx(17),\n                      header.left + sx(74), header.top + sx(75)};\n    fill_round_rect(renderer->dc, icon_well,\n                    mix_color(g_palette.surface_rgb,\n                              g_palette.neutral_accent_rgb, 11U),\n                    rgb(g_palette.neutral_accent_rgb), sx(11));\n    RECT icon = {icon_well.left + sx(5), icon_well.top + sx(5),\n                 icon_well.right - sx(5), icon_well.bottom - sx(5)};\n    draw_image(renderer->dc, &g_nav_images[page_index], &icon);\n\n    wchar_t title_text[128];\n    wchar_t subtitle_text[160];\n    utf8_to_wide(platform_title, title_text,\n                 sizeof(title_text) / sizeof(title_text[0]));\n    utf8_to_wide(page->subtitle, subtitle_text,\n                 sizeof(subtitle_text) / sizeof(subtitle_text[0]));\n    RECT title = {icon_well.right + sx(12), header.top + sx(16),\n                  header.left + sx(420), header.top + sx(47)};\n    draw_text(renderer->dc, title_text, title, g_font_brand,\n              rgb(g_palette.title_rgb),\n              DT_LEFT | DT_VCENTER | DT_SINGLELINE | DT_END_ELLIPSIS);\n    RECT subtitle = {title.left, header.top + sx(50),\n                     header.left + sx(430), header.top + sx(73)};\n    draw_text(renderer->dc, subtitle_text, subtitle, g_font_small,\n              rgb(g_palette.kicker_rgb),\n              DT_LEFT | DT_VCENTER | DT_SINGLELINE | DT_END_ELLIPSIS);\n\n    int metrics_width = sx(322);\n    RECT hero = {header.right - metrics_width - sx(258), header.top + sx(11),\n                 header.right - metrics_width - sx(18), header.top + sx(97)};\n    draw_image(renderer->dc, &g_hero_images[page_index], &hero);\n    return true;\n}\n\nstatic bool win_renderer_workspace_metric(void *context, size_t index,\n                                          const char *caption,\n                                          const char *value)\n{\n    WinWorkspaceRendererContext *renderer = context;\n    if (!renderer || !renderer->dc || index >= 4U || !caption || !value)\n        return false;\n    int metric_w = sx(76);\n    int gap = sx(6);\n    int slot_from_right = 3 - (int)index;\n    int right = renderer->header.right - sx(8) -\n                slot_from_right * (metric_w + gap);\n    RECT metric = {right - metric_w, renderer->header.top + sx(18),\n                   right, renderer->header.top + sx(82)};\n    fill_round_rect(renderer->dc, metric,\n                    mix_color(g_palette.surface_rgb,\n                              g_palette.neutral_accent_rgb,\n                              index == 1U ? 12U : 5U),\n                    rgb(g_palette.border_rgb), sx(9));\n\n    wchar_t value_text[64];\n    wchar_t caption_text[64];\n    utf8_to_wide(value, value_text,\n                 sizeof(value_text) / sizeof(value_text[0]));\n    utf8_to_wide(caption, caption_text,\n                 sizeof(caption_text) / sizeof(caption_text[0]));\n    RECT value_rect = {metric.left + sx(4), metric.top + sx(7),\n                       metric.right - sx(4), metric.top + sx(37)};\n    draw_text(renderer->dc, value_text, value_rect, g_font_title,\n              rgb(g_palette.title_rgb),\n              DT_CENTER | DT_VCENTER | DT_SINGLELINE);\n    RECT caption_rect = {metric.left + sx(3), metric.top + sx(38),\n                         metric.right - sx(3), metric.bottom - sx(5)};\n    draw_text(renderer->dc, caption_text, caption_rect, g_font_small,\n              rgb(g_palette.muted_rgb),\n              DT_CENTER | DT_VCENTER | DT_SINGLELINE);\n    return true;\n}\n\nstatic bool win_renderer_end_workspace_summary(void *context)\n{\n    return context != NULL;\n}\n\nstatic void draw_workspace_header(HDC dc)\n{\n    char storage[4][32] = {{0}};\n    const char *metric_values[4] = {"—", "—", "—", "—"};\n    if (g_page == RUNNER_UI_PAGE_RUNNERS) {\n        size_t total = g_row_count, running = 0U, idle = 0U, offline = 0U;\n        for (size_t i = 0U; i < g_row_count; ++i) {\n            if (strcmp(g_rows[i].state, "RUNNING") == 0) running++;\n            else if (strcmp(g_rows[i].state, "IDLE") == 0) idle++;\n            else offline++;\n        }\n        size_t values[4] = {total, running, idle, offline};\n        for (size_t i = 0U; i < 4U; ++i) {\n            (void)snprintf(storage[i], sizeof(storage[i]), "%zu", values[i]);\n            metric_values[i] = storage[i];\n        }\n    }\n\n    RunnerUiWorkspaceSummaryState summary = {\n        (RunnerUiPageId)g_page,\n        {metric_values[0], metric_values[1], metric_values[2], metric_values[3]}\n    };\n    WinWorkspaceRendererContext workspace = {0};\n    workspace.dc = dc;\n    RunnerUiRenderer renderer = {0};\n    renderer.context = &workspace;\n    renderer.begin_workspace_summary = win_renderer_begin_workspace_summary;\n    renderer.workspace_metric = win_renderer_workspace_metric;\n    renderer.end_workspace_summary = win_renderer_end_workspace_summary;\n    (void)runner_ui_render_workspace_summary(\n        &renderer, RUNNER_UI_PLATFORM_WINDOWS, &summary);\n}\n'''
          replace_once('src/windows_main.c', old_win_workspace, new_win_workspace)

          # Toolkit-free semantic renderer test.
          test_path = Path('tests/ui_contract_test.c')
          test_text = test_path.read_text()
          marker = '''static int verify_page_transition_policy(void)\n{\n'''
          if marker not in test_text:
              raise SystemExit('tests/ui_contract_test.c: page transition marker not found')
          workspace_test = '''typedef struct {\n    size_t begin_count;\n    size_t metric_count;\n    size_t end_count;\n    RunnerUiPageId page;\n    char title[128];\n    char subtitle[128];\n    char nav_asset[64];\n    char hero_asset[64];\n    char captions[4][64];\n    char values[4][64];\n} WorkspaceRecorder;\n\nstatic bool record_begin_workspace_summary(\n    void *context, const RunnerUiPageSpec *page, const char *platform_title)\n{\n    WorkspaceRecorder *recorder = context;\n    if (!recorder || !page || !platform_title) return false;\n    recorder->begin_count++;\n    recorder->page = page->id;\n    (void)snprintf(recorder->title, sizeof(recorder->title),\n                   "%s", platform_title);\n    (void)snprintf(recorder->subtitle, sizeof(recorder->subtitle),\n                   "%s", page->subtitle);\n    (void)snprintf(recorder->nav_asset, sizeof(recorder->nav_asset),\n                   "%s", page->nav_asset);\n    (void)snprintf(recorder->hero_asset, sizeof(recorder->hero_asset),\n                   "%s", page->hero_asset);\n    return true;\n}\n\nstatic bool record_workspace_metric(void *context, size_t index,\n                                    const char *caption, const char *value)\n{\n    WorkspaceRecorder *recorder = context;\n    if (!recorder || index >= 4U || !caption || !value ||\n        recorder->metric_count != index)\n        return false;\n    (void)snprintf(recorder->captions[index],\n                   sizeof(recorder->captions[index]), "%s", caption);\n    (void)snprintf(recorder->values[index],\n                   sizeof(recorder->values[index]), "%s", value);\n    recorder->metric_count++;\n    return true;\n}\n\nstatic bool record_end_workspace_summary(void *context)\n{\n    WorkspaceRecorder *recorder = context;\n    if (!recorder) return false;\n    recorder->end_count++;\n    return true;\n}\n\nstatic int verify_workspace_summary_renderer(void)\n{\n    WorkspaceRecorder recorder = {0};\n    RunnerUiRenderer renderer = {0};\n    renderer.context = &recorder;\n    renderer.begin_workspace_summary = record_begin_workspace_summary;\n    renderer.workspace_metric = record_workspace_metric;\n    renderer.end_workspace_summary = record_end_workspace_summary;\n    RunnerUiWorkspaceSummaryState state = {\n        RUNNER_UI_PAGE_LOCAL_HEALTH, {"4", "3", "2", "1"}\n    };\n    if (!runner_ui_render_workspace_summary(\n            &renderer, RUNNER_UI_PLATFORM_WINDOWS, &state))\n        return 1;\n    if (recorder.begin_count != 1U || recorder.metric_count != 4U ||\n        recorder.end_count != 1U ||\n        recorder.page != RUNNER_UI_PAGE_LOCAL_HEALTH)\n        return 2;\n    if (strcmp(recorder.title, "Local Windows health") != 0 ||\n        strcmp(recorder.subtitle, "SERVICES  •  DIAGNOSTICS  •  LINK") != 0 ||\n        strcmp(recorder.nav_asset, "nav-health.png") != 0 ||\n        strcmp(recorder.hero_asset, "hero-health.png") != 0)\n        return 3;\n    const char *captions[] = {"SERVICES", "RUNNING", "GITHUB", "DIAGNOSTICS"};\n    const char *values[] = {"4", "3", "2", "1"};\n    for (size_t i = 0U; i < 4U; ++i)\n        if (strcmp(recorder.captions[i], captions[i]) != 0 ||\n            strcmp(recorder.values[i], values[i]) != 0)\n            return 4;\n\n    WorkspaceRecorder linux_recorder = {0};\n    renderer.context = &linux_recorder;\n    if (!runner_ui_render_workspace_summary(\n            &renderer, RUNNER_UI_PLATFORM_LINUX, &state))\n        return 5;\n    if (strcmp(linux_recorder.title, "Local Linux health") != 0) return 6;\n\n    RunnerUiRenderer incomplete = {0};\n    if (runner_ui_render_workspace_summary(\n            &incomplete, RUNNER_UI_PLATFORM_LINUX, &state))\n        return 7;\n    state.metric_values[2] = NULL;\n    if (runner_ui_render_workspace_summary(\n            &renderer, RUNNER_UI_PLATFORM_LINUX, &state))\n        return 8;\n    return 0;\n}\n\n'''
          test_text = test_text.replace(marker, workspace_test + marker, 1)
          test_text = test_text.replace(
              '''    if (verify_chrome_renderer() != 0) return 16;\n    if (verify_page_transition_policy() != 0) return 17;\n\n    puts("Runner Monitor shared UI contract, navigation, page transitions and shell chrome renderers passed.");\n''',
              '''    if (verify_chrome_renderer() != 0) return 16;\n    if (verify_page_transition_policy() != 0) return 17;\n    if (verify_workspace_summary_renderer() != 0) return 18;\n\n    puts("Runner Monitor shared UI contract, navigation, page transitions, workspace summary and shell chrome renderers passed.");\n''',
              1)
          test_path.write_text(test_text)

          # Temporary applicator does not belong in the product tree.
          Path('.github/workflows/apply-workspace-summary-1.3.4.yml').unlink()
          PY

