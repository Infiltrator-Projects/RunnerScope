name: Fix RunnerScope first-run visibility and release v1.0.1

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-and-release:
    if: github.event.head_commit.message == 'Fix first-run setup visibility and release v1.0.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch first-run setup visibility and version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('runnerscope.py')
          text = path.read_text(encoding='utf-8')

          old_version = 'VERSION = "1.0.0"'
          new_version = 'VERSION = "1.0.1"'
          if old_version not in text:
              raise SystemExit('Expected v1.0.0 version line not found')
          text = text.replace(old_version, new_version, 1)

          old = '''        self.transient(parent)\n        self.grab_set()\n'''
          new = '''        if parent.winfo_viewable():\n            self.transient(parent)\n        self.grab_set()\n        self.update_idletasks()\n        self.deiconify()\n        self.lift()\n        self.focus_force()\n'''
          if old not in text:
              raise SystemExit('Expected ConfigDialog transient block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install Tkinter for self-test
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Compile and self-test
        run: |
          python3 -m py_compile runnerscope.py
          python3 runnerscope.py --self-test

      - name: Commit corrected source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runnerscope.py
          git commit -m "Fix first-run setup visibility; bump v1.0.1"
          git push origin HEAD:main
          echo "PATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp runnerscope.py dist/RunnerScope-Windows-v1.0.1.py
          cp runnerscope.py dist/RunnerScope-Linux-v1.0.1.py

          ROOT="$RUNNER_TEMP/runnerscope-deb"
          PKG="$ROOT/runnerscope_1.0.1-1_all"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/usr/lib/runnerscope" "$PKG/usr/share/applications" "$PKG/usr/share/doc/runnerscope"

          cat > "$PKG/DEBIAN/control" <<'EOF'
          Package: runnerscope
          Version: 1.0.1-1
          Section: devel
          Priority: optional
          Architecture: all
          Depends: python3 (>= 3.10), python3-tk, gh
          Maintainer: Shannon Smith <noreply@github.com>
          Homepage: https://github.com/Infiltrator-Projects/RunnerScope
          Description: Cross-platform GitHub Actions self-hosted runner monitor
           RunnerScope monitors self-hosted runner connectivity, active jobs,
           history and local runner health from a desktop GUI.
          EOF

          install -m 0644 runnerscope.py "$PKG/usr/lib/runnerscope/runnerscope.py"
          install -m 0644 README.md "$PKG/usr/share/doc/runnerscope/README.md"
          install -m 0644 LICENSE "$PKG/usr/share/doc/runnerscope/copyright"

          cat > "$PKG/usr/bin/runnerscope" <<'EOF'
          #!/bin/sh
          exec python3 /usr/lib/runnerscope/runnerscope.py "$@"
          EOF
          chmod 0755 "$PKG/usr/bin/runnerscope"

          cat > "$PKG/usr/share/applications/runnerscope.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=RunnerScope
          Comment=Monitor GitHub Actions self-hosted runners
          Exec=runnerscope
          Icon=utilities-system-monitor
          Terminal=false
          Categories=Development;System;Monitor;
          EOF

          dpkg-deb --build --root-owner-group "$PKG" "dist/runnerscope_1.0.1-1_all.deb"
          sha256sum \
            dist/RunnerScope-Windows-v1.0.1.py \
            dist/RunnerScope-Linux-v1.0.1.py \
            dist/runnerscope_1.0.1-1_all.deb \
            > dist/SHA256SUMS.txt

      - name: Create v1.0.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          RunnerScope 1.0.1

          Fixes the Windows first-run setup window being hidden while the Python console remained open.

          Downloads:
          - RunnerScope-Windows-v1.0.1.py — direct Windows Python script
          - RunnerScope-Linux-v1.0.1.py — direct Linux Python script
          - runnerscope_1.0.1-1_all.deb — optional Debian/Ubuntu/Linux Mint package
          - SHA256SUMS.txt — checksums

          The Windows and Linux scripts use the same cross-platform code. On first launch the setup dialog is now explicitly made visible and focused before RunnerScope waits for configuration.
          EOF

          gh release create v1.0.1 \
            --target "$PATCH_SHA" \
            --title "RunnerScope 1.0.1" \
            --notes-file /tmp/release-notes.md \
            dist/RunnerScope-Windows-v1.0.1.py \
            dist/RunnerScope-Linux-v1.0.1.py \
            dist/runnerscope_1.0.1-1_all.deb \
            dist/SHA256SUMS.txt
