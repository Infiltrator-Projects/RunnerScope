name: Apply navigation renderer migration

on:
  push:
    branches:
      - migration/ui-renderer-navigation-1.3.1

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Seed navigation renderer migration'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: migration/ui-renderer-navigation-1.3.1
          fetch-depth: 0

      - name: Apply first native renderer unification slice
        run: python3 tools/apply_navigation_renderer_migration.py

      - name: Commit migrated navigation adapters
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git diff --cached --check
          git commit -m 'Unify navigation through native renderer adapters'
          git push origin HEAD:migration/ui-renderer-navigation-1.3.1
