name: One-shot Runner Monitor UI repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ui-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Apply graphical Infiltrator OS repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib, binascii, math

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing patch anchor: {label}")
              return text.replace(old, new, 1)

          def png_chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', binascii.crc32(kind + data) & 0xffffffff)

          class Canvas:
              def __init__(self, w, h, top=(4,12,20), bottom=(2,7,12)):
                  self.w, self.h = w, h
                  self.p = []
                  for y in range(h):
                      t = y / max(1, h - 1)
                      row=[]
                      for x in range(w):
                          glow = max(0.0, 1.0 - abs(x - w*0.72)/(w*0.72)) * 0.10
                          row.append([
                              min(255, int(top[0]*(1-t)+bottom[0]*t + 0*glow)),
                              min(255, int(top[1]*(1-t)+bottom[1]*t + 58*glow)),
                              min(255, int(top[2]*(1-t)+bottom[2]*t + 110*glow)),
                              255])
                      self.p.append(row)
              def set(self,x,y,c):
                  if 0 <= x < self.w and 0 <= y < self.h: self.p[y][x]=list(c)
              def rect(self,x0,y0,x1,y1,c,fill=True):
                  if fill:
                      for y in range(max(0,y0),min(self.h,y1)):
                          for x in range(max(0,x0),min(self.w,x1)): self.set(x,y,c)
                  else:
                      self.line(x0,y0,x1-1,y0,c); self.line(x0,y1-1,x1-1,y1-1,c)
                      self.line(x0,y0,x0,y1-1,c); self.line(x1-1,y0,x1-1,y1-1,c)
              def line(self,x0,y0,x1,y1,c):
                  dx=abs(x1-x0); sx=1 if x0<x1 else -1
                  dy=-abs(y1-y0); sy=1 if y0<y1 else -1; err=dx+dy
                  while True:
                      self.set(x0,y0,c)
                      if x0==x1 and y0==y1: break
                      e2=2*err
                      if e2>=dy: err+=dy; x0+=sx
                      if e2<=dx: err+=dx; y0+=sy
              def circle(self,cx,cy,r,c,fill=False):
                  rr=r*r
                  for y in range(cy-r,cy+r+1):
                      for x in range(cx-r,cx+r+1):
                          d=(x-cx)*(x-cx)+(y-cy)*(y-cy)
                          if (fill and d<=rr) or ((not fill) and rr-r*2<=d<=rr+r*2): self.set(x,y,c)
              def triangle(self,a,b,cpt,color):
                  pts=[a,b,cpt]
                  minx=max(0,min(p[0] for p in pts)); maxx=min(self.w-1,max(p[0] for p in pts))
                  miny=max(0,min(p[1] for p in pts)); maxy=min(self.h-1,max(p[1] for p in pts))
                  def edge(p1,p2,p): return (p[0]-p1[0])*(p2[1]-p1[1])-(p[1]-p1[1])*(p2[0]-p1[0])
                  for y in range(miny,maxy+1):
                      for x in range(minx,maxx+1):
                          w0=edge(pts[1],pts[2],(x,y)); w1=edge(pts[2],pts[0],(x,y)); w2=edge(pts[0],pts[1],(x,y))
                          if (w0>=0 and w1>=0 and w2>=0) or (w0<=0 and w1<=0 and w2<=0): self.set(x,y,color)
              def grid(self,step=18,c=(8,57,78,255)):
                  for x in range(0,self.w,step): self.line(x,0,x,self.h-1,c)
                  for y in range(0,self.h,step): self.line(0,y,self.w-1,y,c)
              def save(self,path):
                  raw=bytearray()
                  for row in self.p:
                      raw.append(0)
                      for px in row: raw.extend(px)
                  data=b'\x89PNG\r\n\x1a\n'+png_chunk(b'IHDR',struct.pack('>IIBBBBB',self.w,self.h,8,6,0,0,0))+png_chunk(b'IDAT',zlib.compress(bytes(raw),9))+png_chunk(b'IEND',b'')
                  path=Path(path); path.parent.mkdir(parents=True,exist_ok=True); path.write_bytes(data)

          CYAN=(0,176,239,255); CYAN2=(0,104,155,255); BLUE=(3,36,56,255); GREEN=(29,201,122,255); GOLD=(232,169,38,255); RED=(232,72,82,255); WHITE=(212,236,248,255); DIM=(60,101,122,255)

          def nav_icon(name, kind, accent):
              c=Canvas(64,64,(5,18,28),(2,9,15)); c.grid(16,(4,38,55,255)); c.rect(5,5,59,59,(6,30,44,255)); c.rect(5,5,59,59,accent,False)
              if kind=='monitor':
                  c.rect(16,17,48,40,accent,False); c.rect(20,21,44,36,(4,13,20,255)); c.line(25,46,39,46,accent); c.line(32,40,32,46,accent)
              elif kind=='play': c.triangle((23,17),(23,47),(47,32),accent)
              elif kind=='clock':
                  c.circle(32,32,15,accent,False); c.line(32,32,32,22,accent); c.line(32,32,41,37,accent)
              elif kind=='health':
                  c.line(12,34,22,34,accent); c.line(22,34,27,20,accent); c.line(27,20,33,45,accent); c.line(33,45,39,28,accent); c.line(39,28,44,34,accent); c.line(44,34,53,34,accent)
              c.save(f'assets/art/{name}')
          nav_icon('nav-runners.png','monitor',CYAN); nav_icon('nav-active.png','play',GREEN); nav_icon('nav-history.png','clock',GOLD); nav_icon('nav-health.png','health',GREEN)

          def hero(name,kind,accent):
              c=Canvas(360,104,(3,18,29),(2,8,14)); c.grid(20,(3,37,55,255))
              for x in range(0,360,40): c.line(x,103,180+(x//40)*7,55,(3,47,68,255))
              if kind=='racks':
                  for i in range(6):
                      x=120+i*34; y=16+(5-i)*3; h=68-(5-i)*3
                      c.rect(x,y,x+23,y+h,(3,25,38,255)); c.rect(x,y,x+23,y+h,accent,False)
                      for yy in range(y+9,y+h-5,10): c.line(x+5,yy,x+17,yy,(0,116,170,255)); c.set(x+19,yy,GREEN)
              elif kind=='activity':
                  for i in range(5): c.triangle((110+i*43,24),(110+i*43,80),(145+i*43,52),accent if i<2 else CYAN2)
              elif kind=='history':
                  c.line(70,58,325,58,accent)
                  for i in range(7):
                      x=82+i*38; c.circle(x,58,5,accent,True); c.line(x,35+(i%3)*8,x,81-(i%2)*9,DIM)
              elif kind=='health':
                  pts=[(55,58),(95,58),(112,40),(129,76),(149,29),(174,68),(194,51),(215,58),(310,58)]
                  for a,b in zip(pts,pts[1:]): c.line(*a,*b,accent)
                  for x in range(260,332,20): c.circle(x,28,4,GREEN,True)
              c.rect(4,4,356,100,(5,76,103,255),False); c.save(f'assets/art/{name}')
          hero('hero-runners.png','racks',CYAN); hero('hero-active.png','activity',GREEN); hero('hero-history.png','history',GOLD); hero('hero-health.png','health',GREEN)

          side=Canvas(160,220,(2,17,27),(1,7,12)); side.grid(16,(2,38,57,255))
          for x in range(0,160,8):
              y=145-int(24*math.sin((x/160)*math.pi*2))-int(8*math.sin((x/160)*math.pi*5))
              side.line(x,219,x,y,(2,35,52,255))
          for x in range(0,152,8):
              y1=145-int(24*math.sin((x/160)*math.pi*2))-int(8*math.sin((x/160)*math.pi*5))
              x2=x+8; y2=145-int(24*math.sin((x2/160)*math.pi*2))-int(8*math.sin((x2/160)*math.pi*5))
              side.line(x,y1,x2,y2,CYAN2)
          side.rect(55,40,105,90,(4,28,40,255)); side.rect(55,40,105,90,CYAN,False); side.circle(80,65,14,CYAN,False); side.circle(80,65,5,CYAN,True)
          side.line(35,112,125,112,DIM); side.line(53,118,107,118,GOLD)
          side.save('assets/art/nav-infiltrator.png')

          p=Path('src/linux_main.c'); s=p.read_text()
          s=replace_once(s,'    GtkWidget *workspace_icon;\n    GtkWidget *workspace_metric_caption[4];','    GtkWidget *workspace_icon;\n    GtkWidget *workspace_art;\n    GtkWidget *workspace_metric_caption[4];','workspace art field')

          anchor='''static void css_define_color(GString *css, const char *name, uint32_t rgb)\n{\n    g_string_append_printf(\n        css, "@define-color %s #%06x;\\n", name, rgb & 0x00ffffffU);\n}\n\n'''
          helpers='''static char *runner_asset_path(const char *name)\n{\n    char *installed = g_build_filename(RUNNERSCOPE_DATA_DIR, "art", name, NULL);\n    if (g_file_test(installed, G_FILE_TEST_IS_REGULAR))\n        return installed;\n    g_free(installed);\n    char *cwd = g_get_current_dir();\n    char *local = g_build_filename(cwd, "assets", "art", name, NULL);\n    g_free(cwd);\n    return local;\n}\n\nstatic GdkPixbuf *runner_asset_pixbuf(const char *name, gint width, gint height)\n{\n    char *path = runner_asset_path(name);\n    GError *error = NULL;\n    GdkPixbuf *pixbuf = gdk_pixbuf_new_from_file_at_scale(\n        path, width, height, TRUE, &error);\n    if (!pixbuf) {\n        g_warning("Runner Monitor artwork %s could not be loaded: %s",\n                  path, error ? error->message : "unknown error");\n        g_clear_error(&error);\n    }\n    g_free(path);\n    return pixbuf;\n}\n\nstatic GtkWidget *runner_asset_image_new(const char *name, gint width, gint height)\n{\n    GdkPixbuf *pixbuf = runner_asset_pixbuf(name, width, height);\n    if (!pixbuf)\n        return gtk_image_new_from_icon_name("image-missing-symbolic", GTK_ICON_SIZE_BUTTON);\n    GtkWidget *image = gtk_image_new_from_pixbuf(pixbuf);\n    g_object_unref(pixbuf);\n    return image;\n}\n\nstatic void runner_asset_image_set(GtkWidget *image, const char *name,\n                                   gint width, gint height)\n{\n    if (!image) return;\n    GdkPixbuf *pixbuf = runner_asset_pixbuf(name, width, height);\n    if (!pixbuf) return;\n    gtk_image_set_from_pixbuf(GTK_IMAGE(image), pixbuf);\n    g_object_unref(pixbuf);\n}\n\nstatic gboolean pango_context_has_family(PangoContext *context, const char *wanted)\n{\n    if (!context || !wanted || !*wanted) return FALSE;\n    PangoFontFamily **families = NULL;\n    int count = 0;\n    pango_context_list_families(context, &families, &count);\n    gboolean found = FALSE;\n    for (int i = 0; i < count; i++) {\n        const char *name = pango_font_family_get_name(families[i]);\n        if (name && g_ascii_strcasecmp(name, wanted) == 0) {\n            found = TRUE;\n            break;\n        }\n    }\n    g_free(families);\n    return found;\n}\n\nstatic void enforce_required_typography(GtkWidget *widget)\n{\n    const InfiltratrTypography *type = infiltratr_typography();\n    PangoContext *context = widget ? gtk_widget_get_pango_context(widget) : NULL;\n    if (!type || !context ||\n        !pango_context_has_family(context, type->ui_family) ||\n        !pango_context_has_family(context, type->brand_family)) {\n        g_error("Runner Monitor requires the Common-verified MB Corpo UI and brand faces");\n    }\n}\n\n'''
          s=replace_once(s,anchor,anchor+helpers,'asset and typography helpers')

          s=replace_once(s,'.header-brand-title {"\n        " font-family:\\"%s\\", \\"%s\\"; font-weight:%u; }\\n"','.header-brand-title, .workspace-title, .workspace-metric-value {"\n        " font-family:\\"%s\\", \\"%s\\"; font-weight:%u; }\\n"','brand typography roles')
          s=replace_once(s,'"button, combobox button {"\n        " background-image:none; background-color:@rm_button_background;"','"button, combobox button {"\n        " background-color:@rm_button_background;"\n        " background-image:linear-gradient(to bottom, alpha(@rm_neutral, 0.16), alpha(@rm_button_background, 0.94));"','button depth')
          s=replace_once(s,'".workspace-header {"\n        " background-color:@rm_connection;"\n        " background-image:linear-gradient(105deg, alpha(@rm_neutral, 0.16),"\n        " @rm_connection 48%%, alpha(@rm_operation, 0.10));"\n        " border-bottom:1px solid alpha(@rm_neutral, 0.36);"\n        " padding:%upx %upx;"\n        "}\\n"','".workspace-header {"\n        " min-height:108px; background-color:@rm_connection;"\n        " background-image:linear-gradient(105deg, alpha(@rm_neutral, 0.30),"\n        " @rm_connection 44%%, alpha(@rm_operation, 0.20));"\n        " border-bottom:1px solid alpha(@rm_neutral, 0.58);"\n        " padding:%upx %upx; box-shadow:0 5px 18px alpha(#000000, 0.30);"\n        "}\\n"','hero header depth')
          s=replace_once(s,'".workspace-icon-well {"\n        " min-width:48px; min-height:48px;"','".workspace-icon-well {"\n        " min-width:58px; min-height:58px;"','larger workspace icon well')
          s=replace_once(s,'".workspace-title { color:@rm_heading; font-size:20px; font-weight:%u; }\\n"\n        ".workspace-subtitle { color:@rm_summary; font-size:11px; }\\n"','".workspace-title { color:@rm_heading; font-size:26px; font-weight:%u; }\\n"\n        ".workspace-subtitle { color:@rm_summary; font-size:10px; letter-spacing:0.4px; }\\n"\n        ".workspace-art-frame { min-width:250px; min-height:84px; background:@rm_input; border:1px solid alpha(@rm_neutral, 0.52); border-radius:14px; padding:3px; box-shadow:0 4px 16px alpha(#000000, 0.28); }\\n"\n        ".workspace-toolbar { background:@rm_panel; border-bottom:1px solid @rm_connection_border; padding:6px 10px; }\\n"\n        ".nav-art-frame { background-image:linear-gradient(to bottom, transparent, alpha(@rm_neutral, 0.07)); border-top:1px solid alpha(@rm_connection_border, 0.65); padding:8px; }\\n"','graphical hero css')
          s=replace_once(s,'" min-width:76px; background-color:@rm_surface;"','" min-width:82px; min-height:58px; background-color:@rm_surface;"','metric size')
          s=replace_once(s,'" color:@rm_heading; font-size:14px; font-weight:%u;"','" color:@rm_heading; font-size:20px; font-weight:%u;"','metric value size')
          s=replace_once(s,'"#runner-main-nav-button:checked {"\n        " background-color:@rm_selection;"\n        " background-image:linear-gradient(100deg, alpha(@rm_neutral, 0.34),"','"#runner-main-nav-button:checked {"\n        " background-color:@rm_selection;"\n        " background-image:linear-gradient(100deg, alpha(@rm_neutral, 0.62),"','stronger nav selection')
          s=replace_once(s,'" box-shadow:0 3px 12px alpha(@rm_neutral, 0.14);"','" box-shadow:0 4px 16px alpha(@rm_neutral, 0.32);"','nav glow')

          # Context visuals and shorter, less text-led page copy.
          replacements=[
          ('''            if (app->workspace_icon) {\n                gtk_image_set_from_icon_name(GTK_IMAGE(app->workspace_icon), "computer-symbolic", GTK_ICON_SIZE_BUTTON);\n                gtk_image_set_pixel_size(GTK_IMAGE(app->workspace_icon), 30);\n            }\n            label_set_if_changed(app->workspace_title, "Runner fleet");\n            label_set_if_changed(\n                app->workspace_subtitle,\n                "Capacity, state changes, workload ownership and utilisation across every self-hosted runner.");''','''            runner_asset_image_set(app->workspace_icon, "nav-runners.png", 36, 36);\n            runner_asset_image_set(app->workspace_art, "hero-runners.png", 300, 86);\n            label_set_if_changed(app->workspace_title, "Runner fleet");\n            label_set_if_changed(app->workspace_subtitle, "CAPACITY  •  WORKLOAD  •  UTILISATION");'''),
          ('''            if (app->workspace_icon) {\n                gtk_image_set_from_icon_name(GTK_IMAGE(app->workspace_icon), "media-playback-start-symbolic", GTK_ICON_SIZE_BUTTON);\n                gtk_image_set_pixel_size(GTK_IMAGE(app->workspace_icon), 30);\n            }\n            label_set_if_changed(app->workspace_title, "Active work");\n            label_set_if_changed(\n                app->workspace_subtitle,\n                "Live workflow execution across local self-hosted capacity and GitHub-hosted jobs.");''','''            runner_asset_image_set(app->workspace_icon, "nav-active.png", 36, 36);\n            runner_asset_image_set(app->workspace_art, "hero-active.png", 300, 86);\n            label_set_if_changed(app->workspace_title, "Active work");\n            label_set_if_changed(app->workspace_subtitle, "LIVE JOBS  •  QUEUES  •  RUNNERS");'''),
          ('''            if (app->workspace_icon) {\n                gtk_image_set_from_icon_name(GTK_IMAGE(app->workspace_icon), "document-open-recent-symbolic", GTK_ICON_SIZE_BUTTON);\n                gtk_image_set_pixel_size(GTK_IMAGE(app->workspace_icon), 30);\n            }\n            label_set_if_changed(app->workspace_title, "Session history");\n            label_set_if_changed(\n                app->workspace_subtitle,\n                "State transitions and work observed by this monitor session.");''','''            runner_asset_image_set(app->workspace_icon, "nav-history.png", 36, 36);\n            runner_asset_image_set(app->workspace_art, "hero-history.png", 300, 86);\n            label_set_if_changed(app->workspace_title, "Session history");\n            label_set_if_changed(app->workspace_subtitle, "STATE  •  EVENTS  •  SESSION");'''),
          ('''            if (app->workspace_icon) {\n                gtk_image_set_from_icon_name(GTK_IMAGE(app->workspace_icon), "utilities-system-monitor-symbolic", GTK_ICON_SIZE_BUTTON);\n                gtk_image_set_pixel_size(GTK_IMAGE(app->workspace_icon), 30);\n            }\n            label_set_if_changed(app->workspace_title, "Local Linux health");\n            label_set_if_changed(\n                app->workspace_subtitle,\n                "Installed runner services, process identity, GitHub linkage and latest diagnostic evidence.");''','''            runner_asset_image_set(app->workspace_icon, "nav-health.png", 36, 36);\n            runner_asset_image_set(app->workspace_art, "hero-health.png", 300, 86);\n            label_set_if_changed(app->workspace_title, "Local Linux health");\n            label_set_if_changed(app->workspace_subtitle, "SERVICES  •  DIAGNOSTICS  •  LINK");''')]
          for i,(old,new) in enumerate(replacements): s=replace_once(s,old,new,f'workspace context {i}')

          s=replace_once(s,'''    GtkWidget *icon =\n        gtk_image_new_from_icon_name(icon_name, GTK_ICON_SIZE_BUTTON);''','''    GtkWidget *icon = runner_asset_image_new(icon_name, 32, 32);''','bitmap nav image')
          s=replace_once(s,'    gtk_image_set_pixel_size(GTK_IMAGE(icon), 24);\n','', 'remove symbolic pixel sizing')

          s=replace_once(s,'''    app->window = gtk_application_window_new(app->application);\n    gtk_window_set_title(GTK_WINDOW(app->window), "Runner Monitor");''','''    app->window = gtk_application_window_new(app->application);\n    enforce_required_typography(app->window);\n    gtk_window_set_title(GTK_WINDOW(app->window), "Runner Monitor");''','mandatory typography runtime gate')

          s=replace_once(s,'''    app->workspace_icon =\n        gtk_image_new_from_icon_name("computer-symbolic", GTK_ICON_SIZE_BUTTON);\n    gtk_image_set_pixel_size(GTK_IMAGE(app->workspace_icon), 30);''','''    app->workspace_icon = runner_asset_image_new("nav-runners.png", 36, 36);''','initial bitmap workspace icon')
          s=replace_once(s,'"Capacity, state changes, workload ownership and utilisation across every self-hosted runner.");','"CAPACITY  •  WORKLOAD  •  UTILISATION");','initial short workspace subtitle')

          old_filter='''    app->filter_entry = gtk_search_entry_new();\n    gtk_entry_set_placeholder_text(\n        GTK_ENTRY(app->filter_entry), "Filter current view…");\n    gtk_widget_set_size_request(app->filter_entry, 240, -1);\n    gtk_style_context_add_class(\n        gtk_widget_get_style_context(app->filter_entry), "workspace-search");\n    g_signal_connect(\n        app->filter_entry, "changed", G_CALLBACK(on_filter_changed), app);\n    gtk_box_pack_start(\n        GTK_BOX(workspace_header), app->filter_entry, FALSE, FALSE, 0);\n\n'''
          art_block='''    GtkWidget *workspace_art_frame = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 0);\n    gtk_style_context_add_class(\n        gtk_widget_get_style_context(workspace_art_frame), "workspace-art-frame");\n    app->workspace_art = runner_asset_image_new("hero-runners.png", 300, 86);\n    gtk_box_pack_start(\n        GTK_BOX(workspace_art_frame), app->workspace_art, TRUE, TRUE, 0);\n    gtk_box_pack_start(\n        GTK_BOX(workspace_header), workspace_art_frame, FALSE, FALSE, 0);\n\n'''
          s=replace_once(s,old_filter,art_block,'replace text/search-heavy hero with bitmap art')

          metrics_anchor='''    gtk_box_pack_end(\n        GTK_BOX(workspace_header), workspace_metrics, FALSE, FALSE, 0);\n\n    app->notebook = gtk_notebook_new();'''
          toolbar='''    gtk_box_pack_end(\n        GTK_BOX(workspace_header), workspace_metrics, FALSE, FALSE, 0);\n\n    GtkWidget *workspace_toolbar =\n        gtk_box_new(GTK_ORIENTATION_HORIZONTAL, (gint)control_spacing);\n    gtk_style_context_add_class(\n        gtk_widget_get_style_context(workspace_toolbar), "workspace-toolbar");\n    app->filter_entry = gtk_search_entry_new();\n    gtk_entry_set_placeholder_text(\n        GTK_ENTRY(app->filter_entry), "Filter current view…");\n    gtk_widget_set_size_request(app->filter_entry, 300, -1);\n    gtk_style_context_add_class(\n        gtk_widget_get_style_context(app->filter_entry), "workspace-search");\n    g_signal_connect(\n        app->filter_entry, "changed", G_CALLBACK(on_filter_changed), app);\n    gtk_box_pack_end(\n        GTK_BOX(workspace_toolbar), app->filter_entry, FALSE, FALSE, 0);\n    gtk_box_pack_start(\n        GTK_BOX(workspace), workspace_toolbar, FALSE, FALSE, 0);\n\n    app->notebook = gtk_notebook_new();'''
          s=replace_once(s,metrics_anchor,toolbar,'workspace filter toolbar')

          s=replace_once(s,'''        {"computer-symbolic", "Runners", "Fleet state and utilisation"},\n        {"media-playback-start-symbolic", "Active jobs", "Work executing now"},\n        {"document-open-recent-symbolic", "History", "Session activity"},\n        {"utilities-system-monitor-symbolic", "Local Linux health", "Services and diagnostics"}''','''        {"nav-runners.png", "Runners", "Fleet state and utilisation"},\n        {"nav-active.png", "Active jobs", "Work executing now"},\n        {"nav-history.png", "History", "Session activity"},\n        {"nav-health.png", "Local Linux health", "Services and diagnostics"}''','bitmap nav asset names')
          s=replace_once(s,'    sync_navigation(app, 0);\n\n    GtkWidget *footer', '''    sync_navigation(app, 0);\n\n    GtkWidget *nav_art_frame = gtk_box_new(GTK_ORIENTATION_VERTICAL, 0);\n    gtk_style_context_add_class(\n        gtk_widget_get_style_context(nav_art_frame), "nav-art-frame");\n    GtkWidget *nav_art = runner_asset_image_new("nav-infiltrator.png", 160, 200);\n    gtk_box_pack_start(GTK_BOX(nav_art_frame), nav_art, FALSE, FALSE, 0);\n    gtk_box_pack_end(GTK_BOX(nav_rail), nav_art_frame, FALSE, FALSE, 8);\n\n    GtkWidget *footer''','sidebar bitmap art')

          old_status='''    char *status = app->config.expected_runners != 0U\n        ? g_strdup_printf(\n            "%u runners detected; expected %u. %u running, %u idle, %u offline.",\n            app->runners_total, app->config.expected_runners,\n            app->runners_running, app->runners_idle, app->runners_offline)\n        : g_strdup_printf(\n            "%u runners detected. %u running, %u idle, %u offline.",\n            app->runners_total, app->runners_running,\n            app->runners_idle, app->runners_offline);'''
          new_status='''    char *status = app->config.expected_runners != 0U\n        ? g_strdup_printf(\n            "%u detected  •  %u expected  •  %u running  •  %u idle  •  %u offline",\n            app->runners_total, app->config.expected_runners,\n            app->runners_running, app->runners_idle, app->runners_offline)\n        : g_strdup_printf(\n            "%u detected  •  %u running  •  %u idle  •  %u offline",\n            app->runners_total, app->runners_running,\n            app->runners_idle, app->runners_offline);'''
          s=replace_once(s,old_status,new_status,'compact footer status')
          p.write_text(s)

          # Build: exact Common pin remains unchanged, but Linux now consumes Common's
          # canonical strict MB Corpo asset provenance and packages the verified faces.
          p=Path('CMakeLists.txt'); c=p.read_text()
          c=replace_once(c,'include(CTest)\n','include(CTest)\ninclude(GNUInstallDirs)\n','GNUInstallDirs')
          anchor='''    find_package(PkgConfig REQUIRED)\n    pkg_check_modules(GTK3 REQUIRED IMPORTED_TARGET gtk+-3.0)\n\n'''
          fonts='''    find_package(PkgConfig REQUIRED)\n    pkg_check_modules(GTK3 REQUIRED IMPORTED_TARGET gtk+-3.0)\n\n    include("${RUNNERSCOPE_COMMON_DIR}/cmake/InfiltratrTypographyAssets.cmake")\n    set(RUNNERSCOPE_FONT_ARCHIVE "${CMAKE_BINARY_DIR}/mb-corpo-fonts.tar.xz")\n    if(NOT EXISTS "${RUNNERSCOPE_FONT_ARCHIVE}")\n        file(DOWNLOAD\n            "${INFILTRATR_MB_CORPO_ARCHIVE_URL}"\n            "${RUNNERSCOPE_FONT_ARCHIVE}"\n            EXPECTED_HASH "SHA256=${INFILTRATR_MB_CORPO_ARCHIVE_SHA256}"\n            TLS_VERIFY ON\n            STATUS RUNNERSCOPE_FONT_DOWNLOAD_STATUS)\n        list(GET RUNNERSCOPE_FONT_DOWNLOAD_STATUS 0 RUNNERSCOPE_FONT_DOWNLOAD_CODE)\n        if(NOT RUNNERSCOPE_FONT_DOWNLOAD_CODE EQUAL 0)\n            list(GET RUNNERSCOPE_FONT_DOWNLOAD_STATUS 1 RUNNERSCOPE_FONT_DOWNLOAD_MESSAGE)\n            message(FATAL_ERROR "Unable to obtain mandatory MB Corpo assets: ${RUNNERSCOPE_FONT_DOWNLOAD_MESSAGE}")\n        endif()\n    endif()\n    file(SHA256 "${RUNNERSCOPE_FONT_ARCHIVE}" RUNNERSCOPE_FONT_ARCHIVE_ACTUAL)\n    if(NOT RUNNERSCOPE_FONT_ARCHIVE_ACTUAL STREQUAL INFILTRATR_MB_CORPO_ARCHIVE_SHA256)\n        message(FATAL_ERROR "Mandatory MB Corpo archive failed Common hash verification")\n    endif()\n    set(RUNNERSCOPE_FONT_DIR "${CMAKE_BINARY_DIR}/mb-corpo-fonts")\n    file(REMOVE_RECURSE "${RUNNERSCOPE_FONT_DIR}")\n    file(MAKE_DIRECTORY "${RUNNERSCOPE_FONT_DIR}")\n    file(ARCHIVE_EXTRACT INPUT "${RUNNERSCOPE_FONT_ARCHIVE}" DESTINATION "${RUNNERSCOPE_FONT_DIR}")\n    foreach(RUNNERSCOPE_FONT_ROLE BRAND_REGULAR UI_BOLD UI_REGULAR)\n        set(RUNNERSCOPE_FONT_FILE_VAR "INFILTRATR_MB_CORPO_${RUNNERSCOPE_FONT_ROLE}_FILE")\n        set(RUNNERSCOPE_FONT_SHA_VAR "INFILTRATR_MB_CORPO_${RUNNERSCOPE_FONT_ROLE}_SHA256")\n        set(RUNNERSCOPE_FONT_PATH "${RUNNERSCOPE_FONT_DIR}/${${RUNNERSCOPE_FONT_FILE_VAR}}")\n        if(NOT EXISTS "${RUNNERSCOPE_FONT_PATH}")\n            message(FATAL_ERROR "Mandatory MB Corpo face missing: ${${RUNNERSCOPE_FONT_FILE_VAR}}")\n        endif()\n        file(SHA256 "${RUNNERSCOPE_FONT_PATH}" RUNNERSCOPE_FONT_ACTUAL_SHA)\n        if(NOT RUNNERSCOPE_FONT_ACTUAL_SHA STREQUAL "${${RUNNERSCOPE_FONT_SHA_VAR}}")\n            message(FATAL_ERROR "Mandatory MB Corpo face failed Common hash verification: ${${RUNNERSCOPE_FONT_FILE_VAR}}")\n        endif()\n    endforeach()\n\n'''
          c=replace_once(c,anchor,fonts,'strict typography build contract')
          c=replace_once(c,'''    target_link_libraries(runnerscope PRIVATE\n        InfiltratrCommon::Common\n        PkgConfig::GTK3\n    )\n''','''    target_link_libraries(runnerscope PRIVATE\n        InfiltratrCommon::Common\n        PkgConfig::GTK3\n    )\n    target_compile_definitions(runnerscope PRIVATE\n        RUNNERSCOPE_DATA_DIR="${CMAKE_INSTALL_FULL_DATADIR}/runnerscope"\n    )\n''','data directory compile definition')
          c=replace_once(c,'''    install(FILES packaging/runnerscope.png\n            DESTINATION share/icons/hicolor/128x128/apps)\n''','''    install(FILES packaging/runnerscope.png\n            DESTINATION share/icons/hicolor/128x128/apps)\n    install(DIRECTORY assets/art/\n            DESTINATION "${CMAKE_INSTALL_DATADIR}/runnerscope/art")\n    install(FILES\n        "${RUNNERSCOPE_FONT_DIR}/${INFILTRATR_MB_CORPO_BRAND_REGULAR_FILE}"\n        "${RUNNERSCOPE_FONT_DIR}/${INFILTRATR_MB_CORPO_UI_BOLD_FILE}"\n        "${RUNNERSCOPE_FONT_DIR}/${INFILTRATR_MB_CORPO_UI_REGULAR_FILE}"\n        DESTINATION "${CMAKE_INSTALL_DATADIR}/fonts/truetype/runnerscope")\n''','install art and fonts')
          p.write_text(c)

          p=Path('debian/control'); d=p.read_text()
          d=d.replace('Build-Depends: debhelper-compat (= 13), cmake, gcc, git, pkg-config, libgtk-3-dev','Build-Depends: debhelper-compat (= 13), ca-certificates, cmake, gcc, git, pkg-config, libgtk-3-dev')
          d=d.replace('Depends: ${shlibs:Depends}, ${misc:Depends}, gh','Depends: ${shlibs:Depends}, ${misc:Depends}, fontconfig, gh')
          d=d.replace(' GitHub CLI remains the current credential/API boundary while the first-party\n provider core is qualified to replace it.',' GitHub CLI remains the current credential/API boundary. The Linux package\n includes the Common-verified MB Corpo faces and product-local bitmap artwork.')
          p.write_text(d)

          Path('debian/infiltrator-runner-monitor.postinst').write_text('''#!/bin/sh\nset -e\ncommand -v fc-cache >/dev/null 2>&1 && fc-cache -f >/dev/null 2>&1 || true\nexit 0\n''')
          Path('debian/infiltrator-runner-monitor.postrm').write_text('''#!/bin/sh\nset -e\ncommand -v fc-cache >/dev/null 2>&1 && fc-cache -f >/dev/null 2>&1 || true\nexit 0\n''')
          Path('debian/infiltrator-runner-monitor.postinst').chmod(0o755)
          Path('debian/infiltrator-runner-monitor.postrm').chmod(0o755)

          p=Path('.github/workflows/ci.yml'); y=p.read_text()
          y=y.replace('sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev','sudo apt-get install -y build-essential ca-certificates cmake fontconfig pkg-config libgtk-3-dev')
          y=y.replace('sudo apt-get install -y             build-essential cmake debhelper devscripts git pkg-config             libgtk-3-dev gh','sudo apt-get install -y             build-essential ca-certificates cmake debhelper devscripts fontconfig git pkg-config             libgtk-3-dev gh')
          smoke='''          test -f /usr/share/icons/hicolor/128x128/apps/runnerscope.png\n          test -f /usr/share/fonts/truetype/runnerscope/mb_corpo_a_cond_regular.ttf\n          test -f /usr/share/fonts/truetype/runnerscope/mb_corpo_s_bold.ttf\n          test -f /usr/share/fonts/truetype/runnerscope/mb_corpo_s_regular.ttf\n          test -f /usr/share/runnerscope/art/hero-runners.png\n          test -f /usr/share/runnerscope/art/nav-infiltrator.png\n          fc-match "MB Corpo S Title WEB" | grep -qi 'MB Corpo'\n          fc-match "MB Corpo A Title Cond WEB" | grep -qi 'MB Corpo'\n'''
          y=replace_once(y,'          test -f /usr/share/icons/hicolor/128x128/apps/runnerscope.png\n',smoke,'CI font/art smoke tests')
          p.write_text(y)

          p=Path('docs/DESIGN.md'); txt=p.read_text()
          txt += '''\n\n## Graphical presentation contract\n\nRunner Monitor is an Infiltrator OS graphical application, not a text-first GTK data viewer. Linux packages the Common-verified MB Corpo UI, bold and brand faces and refuses to launch the graphical shell if the required UI or brand family is unavailable. Product-local raster artwork supplies navigation wells, page hero imagery and persistent Infiltrator OS identity; Common continues to own semantic palette, structural metrics and typography identity. Tables remain the detailed evidence surface, subordinate to the graphical state overview.\n'''
          p.write_text(txt)
          PY

      - name: Commit repaired product and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Runner Monitor repair"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/ui-repair.yml
          git add src/linux_main.c CMakeLists.txt debian .github/workflows/ci.yml docs/DESIGN.md assets/art
          git diff --cached --check
          git commit -m "Restore graphical Infiltrator OS UI contract"
          git push origin HEAD:main
