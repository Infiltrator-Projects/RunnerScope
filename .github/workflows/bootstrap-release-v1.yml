name: Bootstrap RunnerScope v1.0.0 release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Bootstrap RunnerScope v1.0.0 release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/windows dist/linux

          cp runnerscope.py runnerscope_windows.py README.md LICENSE config.example.json dist/windows/
          cp runnerscope.py runnerscope_linux.py README.md LICENSE config.example.json dist/linux/

          (cd dist/windows && zip -q ../RunnerScope-Windows-v1.0.0.zip *)
          tar -C dist/linux -czf dist/RunnerScope-Linux-v1.0.0.tar.gz .
          sha256sum dist/RunnerScope-Windows-v1.0.0.zip dist/RunnerScope-Linux-v1.0.0.tar.gz > dist/SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          RunnerScope 1.0.0

          Initial public release of RunnerScope, a cross-platform desktop monitor for GitHub Actions self-hosted runners.

          Downloads:
          - RunnerScope-Windows-v1.0.0.zip
          - RunnerScope-Linux-v1.0.0.tar.gz
          - SHA256SUMS.txt

          Both platform launchers use the same shared runnerscope.py core. User-specific organisation and runner details are stored only in local configuration and are not embedded in the published source.
          EOF

          if ! gh release view v1.0.0 >/dev/null 2>&1; then
            gh release create v1.0.0 \
              --target "$GITHUB_SHA" \
              --title "RunnerScope 1.0.0" \
              --notes-file /tmp/release-notes.md
          fi

          gh release upload v1.0.0 \
            dist/RunnerScope-Windows-v1.0.0.zip \
            dist/RunnerScope-Linux-v1.0.0.tar.gz \
            dist/SHA256SUMS.txt \
            --clobber

      - name: Remove temporary bootstrap branches
        shell: bash
        run: |
          set -u
          for branch in \
            release-action \
            release-bootstrap \
            release-bootstrap-final \
            release-bootstrap-v1.0.0 \
            release-now \
            release-trigger \
            release-v1-bootstrap \
            release-v1.0.0 \
            temp-release-bootstrap \
            v1-release-workflow \
            noop-check
          do
            git push origin --delete "$branch" || true
          done
