# SPDX-License-Identifier: GPL-3.0-or-later
name: Clean runner routing probe

on:
  push:
    paths:
      - .github/workflows/configure-runner-routing.yml

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel obsolete queued label probe
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST /repos/Infiltrator-Projects/RunnerScope/actions/runs/36316958448/cancel || true
