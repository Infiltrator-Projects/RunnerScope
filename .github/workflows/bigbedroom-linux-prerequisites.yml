# SPDX-License-Identifier: GPL-3.0-or-later
name: BigBedroom Linux prerequisites

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bigbedroom-linux-prerequisites.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Report shared BigBedroom Linux capabilities
    runs-on: bigbedroom
    timeout-minutes: 10
    steps:
      - name: Report build and checkout prerequisites
        shell: bash
        run: |
          set -u
          for command_name in git cmake ctest make gcc g++ clang pkg-config dpkg-deb xvfb-run; do
            if command -v "$command_name" >/dev/null 2>&1; then
              printf 'present: %s -> %s\n' "$command_name" "$(command -v "$command_name")"
            else
              printf 'missing: %s\n' "$command_name"
            fi
          done
          if command -v pkg-config >/dev/null 2>&1; then
            for module in x11 gtk4 libusb-1.0; do
              if pkg-config --exists "$module" 2>/dev/null; then
                printf 'present pkg-config module: %s\n' "$module"
              else
                printf 'missing pkg-config module: %s\n' "$module"
              fi
            done
          fi
          printf 'This workflow reports host capability only; it does not require privileged package installation.\n'
