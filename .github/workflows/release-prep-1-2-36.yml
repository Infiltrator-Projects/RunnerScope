# SPDX-License-Identifier: GPL-3.0-or-later
name: Prepare Runner Monitor 1.2.36

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-prep-1-2-36.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Version and document graphical repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          version='1.2.36'
          Path('VERSION').write_text(version+'\n')
          deb=Path('debian/changelog')
          deb_entry='''infiltrator-runner-monitor (1.2.36) unstable; urgency=medium

  * Make Common-verified MB Corpo UI, bold and brand typography mandatory in
    the native Linux package instead of silently falling back to system fonts.
  * Add product-local bitmap artwork for navigation, page identity, runner
    fleet/activity/history/health hero surfaces and persistent OS identity.
  * Replace long workspace prose with compact state kickers and move filtering
    out of the hero so visual hierarchy leads the page.
  * Strengthen Infiltrator OS gradients, shaped wells, card depth and graphical
    state treatment while retaining the current responsiveness fixes.
  * Verify the packaged MB faces and bitmap assets in clean-install CI.
  * Keep the exact latest Infiltratr Common 1.19.38 pin.

 -- Shannon Smith <infiltratr@yandex.com>  Sat, 03 Oct 2026 17:24:00 +1000

'''
          deb.write_text(deb_entry+deb.read_text())
          ch=Path('CHANGELOG.md')
          text=ch.read_text()
          anchor='## Unreleased\n\nNo unreleased changes.\n'
          entry='''## Unreleased

No unreleased changes.

## 1.2.36 - 2026-10-03

- Make the Common-verified MB Corpo UI, bold and brand faces mandatory for the native Linux package rather than permitting silent system-font substitution.
- Add real product-local raster artwork for navigation, runner/activity/history/health hero surfaces and persistent Infiltrator OS identity.
- Replace long page prose with compact state kickers and move search below the hero so the graphical overview leads the workspace.
- Strengthen gradients, wells, card depth and state hierarchy without reverting the responsiveness improvements from 1.2.27-1.2.35.
- Verify installed MB typography and graphical assets during clean-package CI.
- Keep the exact current Infiltratr Common 1.19.38 / 7070c5812b50821fd7580101cb2289a3184f6b2c pin.
'''
          if anchor not in text:
              raise SystemExit('CHANGELOG anchor missing')
          ch.write_text(text.replace(anchor,entry,1))
          PY
          git config user.name "Runner Monitor release"
          git config user.email "actions@users.noreply.github.com"
          git add VERSION debian/changelog CHANGELOG.md
          git diff --cached --check
          git commit -m "Release 1.2.36"
          git push origin HEAD:main
