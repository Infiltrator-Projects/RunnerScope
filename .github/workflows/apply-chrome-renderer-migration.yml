name: Apply shell chrome renderer migration

on:
  push:
    branches:
      - migration/ui-renderer-chrome-1.3.2

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Trigger shell chrome renderer migration'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: migration/ui-renderer-chrome-1.3.2
          fetch-depth: 0
      - name: Apply shared header/footer renderer slice
        run: python3 tools/apply_chrome_renderer_migration.py
      - name: Commit migrated shell chrome adapters
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git diff --cached --check
          git commit -m 'Unify shell chrome through native renderer adapters'
          git push origin HEAD:migration/ui-renderer-chrome-1.3.2
