name: Runner Monitor 1.2.33 qualified forensic patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner-monitor-133-qualification.yml'

permissions:
  contents: write

concurrency:
  group: runner-monitor-133-qualified-patch
  cancel-in-progress: false

jobs:
  qualify-and-publish-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source and Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify latest Common
        shell: bash
        run: |
          set -euo pipefail
          latest_common="$(git ls-remote https://github.com/Infiltrator-Projects/Infiltrator-Libraries.git refs/heads/main | awk '{print $1}')"
          pinned_common="$(git ls-tree HEAD infiltratr-common | awk '{print $3}')"
          test "$latest_common" = '7070c5812b50821fd7580101cb2289a3184f6b2c'
          test "$pinned_common" = "$latest_common"
          test "$(tr -d '[:space:]' < infiltratr-common/VERSION)" = '1.19.38'

      - name: Apply forensic patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/forensic_fix_133.py
          test "$(tr -d '[:space:]' < VERSION)" = '1.2.33'
          ! grep -F 'hero-card' src/linux_main.c
          ! grep -F 'hero-title' src/linux_main.c
          ! grep -F 'counter_labels' src/linux_main.c
          ! grep -F 'make_counter' src/linux_main.c
          ! grep -F 'summary_label' src/linux_main.c
          ! grep -F 'updated_label' src/linux_main.c
          ! grep -F 'scan_label' src/linux_main.c
          ! grep -F 'repository_cache_seconds' src/windows_main.c config.example.json
          ! grep -F 'history_entries' src/windows_main.c config.example.json
          grep -F 'MAX(3U, (guint)g_ascii_strtoull' src/linux_main.c >/dev/null
          grep -F 'MAX(15U, (guint)g_ascii_strtoull' src/linux_main.c >/dev/null
          grep -F 'theme_state_valid' src/linux_main.c >/dev/null
          grep -F 'gtk_notebook_get_current_page(GTK_NOTEBOOK(app->notebook)) != 3' src/linux_main.c >/dev/null
          grep -F 'g_timeout_add(1200U, initial_activity_refresh_cb, app)' src/linux_main.c >/dev/null
          grep -F 'g_timeout_add(180U, apply_filter_cb, app)' src/linux_main.c >/dev/null
          git diff --check

      - name: Build and qualify refreshed Linux source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev
          cmake -S . -B /tmp/runnerscope-133 -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/runnerscope-133 --parallel
          ctest --test-dir /tmp/runnerscope-133 --output-on-failure
          /tmp/runnerscope-133/runnerscope --self-test
          test "$(/tmp/runnerscope-133/runnerscope --common-version)" = '1.19.38'

      - name: Publish qualified release source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git rm .github/workflows/runner-monitor-133-forensic-pass.yml
          git rm .github/workflows/runner-monitor-133-qualification.yml
          git rm tools/forensic_fix_133.py
          git add src/linux_main.c src/windows_main.c config.example.json README.md VERSION CHANGELOG.md debian/changelog
          git diff --cached --check
          git commit -m 'Release 1.2.33: remove legacy shell duplication and reduce refresh churn'
          git push origin HEAD:main
