name: BigBedroom label probe

on:
  push:
    paths:
      - .github/workflows/runner-home-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, home]
    timeout-minutes: 2
    steps:
      - name: Report selected runner
        shell: bash
        run: |
          printf 'runner=%s\n' "${{ runner.name }}"
          printf 'environment=%s\n' "${{ runner.environment }}"
