# SPDX-License-Identifier: GPL-3.0-or-later
name: Runner Monitor qualified forensic refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/forensic-refresh2.yml
      - tools/forensic_refresh_128.py

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'Run forensic refresh 2'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact source and Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply forensic cleanup and current Common pin
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/forensic_refresh_128.py
          git -C infiltratr-common fetch origin main
          git -C infiltratr-common checkout 7070c5812b50821fd7580101cb2289a3184f6b2c
          rm -f tools/prefer-bigbedroom-runners.sh
          if grep -R -n --exclude-dir=.git --exclude-dir=infiltratr-common \
              -E '7cc5de3de0e94ed2cfcff0840bbb5346eb5c9c9f|runnerscope-firstparty|src/native2' \
              CMakeLists.txt README.md docs src 2>/dev/null; then
            echo 'Retired live implementation/Common references remain.' >&2
            exit 1
          fi

      - name: Build and qualify refreshed source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev
          cmake -S . -B build-forensic -DCMAKE_BUILD_TYPE=Release
          cmake --build build-forensic --parallel
          ctest --test-dir build-forensic --output-on-failure
          ./build-forensic/runnerscope --self-test
          test "$(./build-forensic/runnerscope --common-version)" = '1.19.38'

      - name: Publish qualified source commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/forensic_refresh_128.py
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git diff --cached --check
          git commit -m 'Release 1.2.28: forensic performance and Infiltrator OS alignment'
          git push origin HEAD:main
