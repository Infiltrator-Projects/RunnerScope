# SPDX-License-Identifier: GPL-3.0-or-later
name: Runner Monitor 1.2.35 visual recovery

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/runner-monitor-135-visual-recovery.yml

permissions:
  contents: write

jobs:
  recover-visual-language:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source and Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify latest Common pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < infiltratr-common/VERSION)" = "1.19.38"
          test "$(git ls-tree HEAD infiltratr-common | awk '{print $3}')" = "7070c5812b50821fd7580101cb2289a3184f6b2c"
          test "$(git ls-remote https://github.com/Infiltrator-Projects/Infiltrator-Libraries.git refs/heads/main | awk '{print $1}')" = "7070c5812b50821fd7580101cb2289a3184f6b2c"

      - name: Restore graphical Infiltrator OS hierarchy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/linux_main.c')
          s = path.read_text()

          def replace_once(old, new, label):
              global s
              if s.count(old) != 1:
                  raise SystemExit(f'{label}: expected one match, found {s.count(old)}')
              s = s.replace(old, new, 1)

          replace_once(
              '    GtkWidget *workspace_title;\n    GtkWidget *workspace_subtitle;\n',
              '    GtkWidget *workspace_title;\n    GtkWidget *workspace_subtitle;\n    GtkWidget *workspace_icon;\n',
              'workspace icon state')

          replace_once(
              '        "#runner-root {"\n'
              '        " background-image:none; background-color:@rm_background;"\n'
              '        "}\\n"\n',
              '        "#runner-root {"\n'
              '        " background-color:@rm_background;"\n'
              '        " background-image:linear-gradient(145deg, alpha(@rm_neutral, 0.055),"\n'
              '        " alpha(@rm_operation, 0.018) 42%, transparent 78%);"\n'
              '        "}\\n"\n',
              'root visual depth')

          replace_once(
              '        "headerbar.runner-header {"\n'
              '        " min-height:58px; padding:%upx %upx;"\n'
              '        " background-image:none; background-color:@rm_titlebar;"\n'
              '        " border-bottom:1px solid @rm_border;"\n'
              '        "}\\n"\n'
              '        ".header-brand { padding:2px 4px; }\\n"\n'
              '        ".header-brand-icon {"\n'
              '        " background-color:@rm_card; border:1px solid @rm_border;"\n'
              '        " border-radius:%upx; padding:%upx; box-shadow:none;"\n'
              '        "}\\n"\n',
              '        "headerbar.runner-header {"\n'
              '        " min-height:58px; padding:%upx %upx;"\n'
              '        " background-color:@rm_titlebar;"\n'
              '        " background-image:linear-gradient(110deg, alpha(@rm_neutral, 0.24),"\n'
              '        " @rm_titlebar 42%, alpha(@rm_operation, 0.18));"\n'
              '        " border-bottom:1px solid alpha(@rm_neutral, 0.52);"\n'
              '        " box-shadow:0 3px 14px alpha(#000000, 0.28);"\n'
              '        "}\\n"\n'
              '        ".header-brand { padding:2px 4px; }\\n"\n'
              '        ".header-brand-icon {"\n'
              '        " background-color:@rm_card;"\n'
              '        " background-image:linear-gradient(135deg, alpha(@rm_neutral, 0.28),"\n'
              '        " alpha(@rm_operation, 0.12));"\n'
              '        " border:1px solid alpha(@rm_neutral, 0.62);"\n'
              '        " border-radius:%upx; padding:%upx;"\n'
              '        " box-shadow:0 2px 9px alpha(@rm_neutral, 0.16);"\n'
              '        "}\\n"\n',
              'header graphical treatment')

          replace_once(
              '        ".runner-window-control {"\n'
              '        " min-width:30px; min-height:30px; padding:4px;"\n'
              '        " background-image:none; background-color:transparent;"\n'
              '        " border:1px solid transparent; border-radius:%upx; box-shadow:none;"\n'
              '        "}\\n"\n',
              '        ".runner-window-control {"\n'
              '        " min-width:30px; min-height:30px; padding:4px;"\n'
              '        " background-color:alpha(@rm_surface, 0.72);"\n'
              '        " background-image:linear-gradient(to bottom, alpha(@rm_neutral, 0.08),"\n'
              '        " alpha(@rm_surface, 0.42));"\n'
              '        " border:1px solid alpha(@rm_connection_border, 0.72);"\n'
              '        " border-radius:%upx; box-shadow:0 1px 4px alpha(#000000, 0.18);"\n'
              '        "}\\n"\n',
              'header control wells')

          replace_once(
              '        ".runner-content-shell {"\n'
              '        " background:@rm_card; border:1px solid @rm_border;"\n'
              '        " border-radius:%upx;"\n'
              '        "}\\n"\n'
              '        ".runner-workspace {"\n'
              '        " background:@rm_card; border-radius:0 %upx %upx 0;"\n'
              '        "}\\n"\n'
              '        ".workspace-header {"\n'
              '        " background:@rm_connection; border-bottom:1px solid @rm_connection_border;"\n'
              '        " padding:%upx %upx;"\n'
              '        "}\\n"\n',
              '        ".runner-content-shell {"\n'
              '        " background:@rm_card; border:1px solid @rm_connection_border;"\n'
              '        " border-radius:%upx;"\n'
              '        " box-shadow:0 5px 18px alpha(#000000, 0.22);"\n'
              '        "}\\n"\n'
              '        ".runner-workspace {"\n'
              '        " background:@rm_card; border-radius:0 %upx %upx 0;"\n'
              '        "}\\n"\n'
              '        ".workspace-header {"\n'
              '        " background-color:@rm_connection;"\n'
              '        " background-image:linear-gradient(105deg, alpha(@rm_neutral, 0.16),"\n'
              '        " @rm_connection 48%, alpha(@rm_operation, 0.10));"\n'
              '        " border-bottom:1px solid alpha(@rm_neutral, 0.36);"\n'
              '        " padding:%upx %upx;"\n'
              '        "}\\n"\n',
              'workspace depth')

          replace_once(
              '        ".workspace-title { color:@rm_heading; font-size:18px; font-weight:%u; }\\n"\n',
              '        ".workspace-icon-well {"\n'
              '        " min-width:48px; min-height:48px;"\n'
              '        " background-color:@rm_surface;"\n'
              '        " background-image:linear-gradient(135deg, alpha(@rm_neutral, 0.30),"\n'
              '        " alpha(@rm_operation, 0.12));"\n'
              '        " border:1px solid alpha(@rm_neutral, 0.56); border-radius:16px;"\n'
              '        " box-shadow:0 3px 10px alpha(@rm_neutral, 0.14); padding:7px;"\n'
              '        "}\\n"\n'
              '        ".workspace-icon { color:@rm_accent_foreground; }\\n"\n'
              '        ".workspace-title { color:@rm_heading; font-size:20px; font-weight:%u; }\\n"\n',
              'workspace icon well')

          replace_once(
              '        ".workspace-metric {"\n'
              '        " min-width:76px; background:@rm_surface;"\n'
              '        " border:1px solid @rm_connection_border; border-radius:%upx;"\n'
              '        " padding:%upx %upx;"\n'
              '        "}\\n"\n',
              '        ".workspace-metric {"\n'
              '        " min-width:76px; background-color:@rm_surface;"\n'
              '        " background-image:linear-gradient(145deg, alpha(@rm_neutral, 0.08),"\n'
              '        " alpha(@rm_card, 0.82));"\n'
              '        " border:1px solid @rm_connection_border; border-top:2px solid @rm_neutral;"\n'
              '        " border-radius:%upx; padding:%upx %upx;"\n'
              '        " box-shadow:0 2px 8px alpha(#000000, 0.16);"\n'
              '        "}\\n"\n',
              'metric cards')

          replace_once(
              '        "notebook.runner-notebook { background:@rm_card; border:0; }\\n",\n',
              '        "notebook.runner-notebook { background:@rm_card; border:0; }\\n"\n'
              '        ".workspace-metric.metric-one { border-top-color:@rm_info; }\\n"\n'
              '        ".workspace-metric.metric-two { border-top-color:@rm_success; }\\n"\n'
              '        ".workspace-metric.metric-three { border-top-color:@rm_warning; }\\n"\n'
              '        ".workspace-metric.metric-four { border-top-color:@rm_operation; }\\n",\n',
              'metric accents')

          replace_once(
              '        "#runner-main-navigation, #runner-main-navigation viewport {"\n'
              '        " background-image:none; background-color:@rm_panel;"\n'
              '        " border-color:@rm_connection_border;"\n'
              '        "}\\n"\n',
              '        "#runner-main-navigation, #runner-main-navigation viewport {"\n'
              '        " background-color:@rm_panel;"\n'
              '        " background-image:linear-gradient(to bottom, alpha(@rm_neutral, 0.055),"\n'
              '        " transparent 38%, alpha(@rm_operation, 0.025));"\n'
              '        " border-color:@rm_connection_border;"\n'
              '        "}\\n"\n',
              'navigation depth')

          replace_once(
              '        "#runner-main-nav-button:checked {"\n'
              '        " background-image:none; background-color:@rm_selection;"\n'
              '        " color:@rm_selection_text; border-color:@rm_neutral;"\n'
              '        " box-shadow:none;"\n'
              '        "}\\n"\n',
              '        "#runner-main-nav-button:checked {"\n'
              '        " background-color:@rm_selection;"\n'
              '        " background-image:linear-gradient(100deg, alpha(@rm_neutral, 0.34),"\n'
              '        " @rm_selection 58%, alpha(@rm_operation, 0.16));"\n'
              '        " color:@rm_selection_text; border-color:alpha(@rm_neutral, 0.76);"\n'
              '        " box-shadow:0 3px 12px alpha(@rm_neutral, 0.14);"\n'
              '        "}\\n"\n',
              'selected navigation')

          replace_once(
              '        "#runner-main-nav-button .runner-main-nav-icon {"\n'
              '        " min-width:38px; min-height:38px;"\n'
              '        " color:@rm_neutral; background-color:@rm_surface;"\n'
              '        " border:1px solid @rm_border; border-radius:10px; padding:5px;"\n'
              '        "}\\n"\n',
              '        "#runner-main-nav-button .runner-main-nav-icon {"\n'
              '        " min-width:38px; min-height:38px; color:@rm_neutral;"\n'
              '        " background-color:@rm_surface;"\n'
              '        " background-image:linear-gradient(135deg, alpha(@rm_neutral, 0.20),"\n'
              '        " alpha(@rm_card, 0.76));"\n'
              '        " border:1px solid alpha(@rm_connection_border, 0.88);"\n'
              '        " border-radius:12px; padding:5px;"\n'
              '        " box-shadow:0 2px 8px alpha(#000000, 0.18);"\n'
              '        "}\\n"\n'
              '        "#runner-main-nav-button:checked .runner-main-nav-icon {"\n'
              '        " color:@rm_accent_foreground;"\n'
              '        " background-image:linear-gradient(135deg, @rm_neutral, @rm_operation);"\n'
              '        " border-color:alpha(@rm_accent_foreground, 0.48);"\n'
              '        " box-shadow:0 3px 10px alpha(@rm_neutral, 0.26);"\n'
              '        "}\\n"\n',
              'navigation icon wells')

          replace_once(
              '        "scrolledwindow.runner-table { background:@rm_card; border:0; }\\n"\n',
              '        "scrolledwindow.runner-table {"\n'
              '        " background:@rm_card; border:1px solid @rm_connection_border;"\n'
              '        " border-radius:10px; box-shadow:inset 0 1px 0 alpha(@rm_neutral, 0.08);"\n'
              '        "}\\n"\n',
              'table frame')

          replace_once(
              '        "treeview.view header button {"\n'
              '        " background-image:none; background:@rm_panel; color:@rm_title;"\n'
              '        " border:0; border-bottom:1px solid @rm_connection_border;"\n',
              '        "treeview.view header button {"\n'
              '        " background-color:@rm_panel; color:@rm_title;"\n'
              '        " background-image:linear-gradient(to bottom, alpha(@rm_neutral, 0.10),"\n'
              '        " alpha(@rm_panel, 0.94));"\n'
              '        " border:0; border-bottom:1px solid @rm_connection_border;"\n',
              'table header depth')

          replace_once(
              '        ".selection-card {"\n'
              '        " background:@rm_connection; border-top:1px solid @rm_connection_border;"\n'
              '        " padding:%upx %upx;"\n'
              '        "}\\n"\n'
              '        ".selection-icon { color:@rm_neutral; padding:4px; }\\n"\n',
              '        ".selection-card {"\n'
              '        " background-color:@rm_connection;"\n'
              '        " background-image:linear-gradient(100deg, alpha(@rm_neutral, 0.12),"\n'
              '        " @rm_connection 58%, alpha(@rm_operation, 0.08));"\n'
              '        " border-top:1px solid alpha(@rm_neutral, 0.34);"\n'
              '        " padding:%upx %upx;"\n'
              '        "}\\n"\n'
              '        ".selection-icon-well {"\n'
              '        " background-image:linear-gradient(135deg, alpha(@rm_neutral, 0.26),"\n'
              '        " alpha(@rm_operation, 0.10)); border:1px solid @rm_connection_border;"\n'
              '        " border-radius:12px; padding:6px;"\n'
              '        "}\\n"\n'
              '        ".selection-icon { color:@rm_neutral; }\\n"\n',
              'selection treatment')

          replace_once(
              '        ".footer-card {"\n'
              '        " background:@rm_card; border:1px solid @rm_border;"\n'
              '        " border-radius:%upx; padding:%upx %upx;"\n'
              '        "}\\n"\n'
              '        "#footer-actions button {"\n'
              '        " border-radius:%upx; min-height:30px; padding:4px 10px;"\n'
              '        "}\\n"\n',
              '        ".footer-card {"\n'
              '        " background-color:@rm_card;"\n'
              '        " background-image:linear-gradient(105deg, alpha(@rm_neutral, 0.06),"\n'
              '        " @rm_card 54%, alpha(@rm_operation, 0.035));"\n'
              '        " border:1px solid @rm_connection_border; border-radius:%upx;"\n'
              '        " padding:%upx %upx; box-shadow:0 3px 12px alpha(#000000, 0.18);"\n'
              '        "}\\n"\n'
              '        "#footer-actions button {"\n'
              '        " border-radius:%upx; min-height:34px; padding:5px 11px;"\n'
              '        "}\\n"\n',
              'footer depth')

          anchor = '''        ".version-text { color:@rm_detail_label; font-size:10px; }\\n",\n'''
          addition = '''        ".version-text { color:@rm_detail_label; font-size:10px; }\\n"\n        ".runner-action-button {"\n        " background-color:@rm_surface;"\n        " background-image:linear-gradient(to bottom, alpha(@rm_neutral, 0.10),"\n        " alpha(@rm_surface, 0.88)); border:1px solid @rm_connection_border;"\n        " box-shadow:0 2px 7px alpha(#000000, 0.18);"\n        "}\\n"\n        ".runner-action-button:hover { border-color:@rm_neutral; }\\n"\n        ".runner-action-primary {"\n        " background-image:linear-gradient(135deg, @rm_neutral, @rm_operation);"\n        " color:@rm_accent_foreground; border-color:alpha(@rm_accent_foreground, 0.42);"\n        "}\\n"\n        ".runner-action-primary label, .runner-action-primary image { color:@rm_accent_foreground; }\\n"\n        ".runner-action-warning { border-color:alpha(@rm_warning, 0.58); }\\n",\n'''
          replace_once(anchor, addition, 'action button styling')

          # Give the workspace header a page identity icon.
          replace_once(
              '    gtk_box_pack_start(GTK_BOX(workspace), workspace_header, FALSE, FALSE, 0);\n\n'
              '    GtkWidget *workspace_copy = gtk_box_new(GTK_ORIENTATION_VERTICAL, 2);\n',
              '    gtk_box_pack_start(GTK_BOX(workspace), workspace_header, FALSE, FALSE, 0);\n\n'
              '    GtkWidget *workspace_icon_well = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 0);\n'
              '    gtk_style_context_add_class(\n'
              '        gtk_widget_get_style_context(workspace_icon_well), "workspace-icon-well");\n'
              '    app->workspace_icon =\n'
              '        gtk_image_new_from_icon_name("computer-symbolic", GTK_ICON_SIZE_BUTTON);\n'
              '    gtk_image_set_pixel_size(GTK_IMAGE(app->workspace_icon), 30);\n'
              '    gtk_style_context_add_class(\n'
              '        gtk_widget_get_style_context(app->workspace_icon), "workspace-icon");\n'
              '    gtk_box_pack_start(\n'
              '        GTK_BOX(workspace_icon_well), app->workspace_icon, TRUE, TRUE, 0);\n'
              '    gtk_box_pack_start(\n'
              '        GTK_BOX(workspace_header), workspace_icon_well, FALSE, FALSE, 0);\n\n'
              '    GtkWidget *workspace_copy = gtk_box_new(GTK_ORIENTATION_VERTICAL, 2);\n',
              'workspace identity icon')

          # Give each metric a persistent visual accent without changing semantics.
          old = '''        GtkWidget *metric = make_workspace_metric(\n            "—", &app->workspace_metric_caption[i],\n            &app->workspace_metric_value[i]);\n        gtk_grid_attach(GTK_GRID(workspace_metrics), metric, (gint)i, 0, 1, 1);\n'''
          new = '''        GtkWidget *metric = make_workspace_metric(\n            "—", &app->workspace_metric_caption[i],\n            &app->workspace_metric_value[i]);\n        const char *metric_classes[] = {\n            "metric-one", "metric-two", "metric-three", "metric-four"\n        };\n        gtk_style_context_add_class(\n            gtk_widget_get_style_context(metric), metric_classes[i]);\n        gtk_grid_attach(GTK_GRID(workspace_metrics), metric, (gint)i, 0, 1, 1);\n'''
          replace_once(old, new, 'metric classes')

          # Wrap the selection icon in a real icon well.
          replace_once(
              '    GtkWidget *selection_icon =\n'
              '        gtk_image_new_from_icon_name("dialog-information-symbolic", GTK_ICON_SIZE_BUTTON);\n'
              '    gtk_image_set_pixel_size(GTK_IMAGE(selection_icon), 22);\n'
              '    gtk_style_context_add_class(\n'
              '        gtk_widget_get_style_context(selection_icon), "selection-icon");\n'
              '    gtk_box_pack_start(\n'
              '        GTK_BOX(app->selection_card), selection_icon, FALSE, FALSE, 0);\n',
              '    GtkWidget *selection_icon_well =\n'
              '        gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 0);\n'
              '    gtk_style_context_add_class(\n'
              '        gtk_widget_get_style_context(selection_icon_well), "selection-icon-well");\n'
              '    GtkWidget *selection_icon =\n'
              '        gtk_image_new_from_icon_name("dialog-information-symbolic", GTK_ICON_SIZE_BUTTON);\n'
              '    gtk_image_set_pixel_size(GTK_IMAGE(selection_icon), 22);\n'
              '    gtk_style_context_add_class(\n'
              '        gtk_widget_get_style_context(selection_icon), "selection-icon");\n'
              '    gtk_box_pack_start(\n'
              '        GTK_BOX(selection_icon_well), selection_icon, TRUE, TRUE, 0);\n'
              '    gtk_box_pack_start(\n'
              '        GTK_BOX(app->selection_card), selection_icon_well, FALSE, FALSE, 0);\n',
              'selection icon well')

          # Update the page identity icon with the workspace.
          replace_once(
