              '        case 0:\n            if (app->workspace_icon) {\n                gtk_image_set_from_icon_name(\n                    GTK_IMAGE(app->workspace_icon), "computer-symbolic", GTK_ICON_SIZE_BUTTON);\n                gtk_image_set_pixel_size(GTK_IMAGE(app->workspace_icon), 30);\n            }\n            label_set_if_changed(app->workspace_title, "Runner fleet");\n',
              'runner page icon')
          replace_once(
              '        case 1:\n            label_set_if_changed(app->workspace_title, "Active work");\n',
              '        case 1:\n            if (app->workspace_icon) {\n                gtk_image_set_from_icon_name(\n                    GTK_IMAGE(app->workspace_icon), "media-playback-start-symbolic", GTK_ICON_SIZE_BUTTON);\n                gtk_image_set_pixel_size(GTK_IMAGE(app->workspace_icon), 30);\n            }\n            label_set_if_changed(app->workspace_title, "Active work");\n',
              'activity page icon')
          replace_once(
              '        case 2: {\n            label_set_if_changed(app->workspace_title, "Session history");\n',
              '        case 2: {\n            if (app->workspace_icon) {\n                gtk_image_set_from_icon_name(\n                    GTK_IMAGE(app->workspace_icon), "document-open-recent-symbolic", GTK_ICON_SIZE_BUTTON);\n                gtk_image_set_pixel_size(GTK_IMAGE(app->workspace_icon), 30);\n            }\n            label_set_if_changed(app->workspace_title, "Session history");\n',
              'history page icon')
          replace_once(
              '        default:\n            label_set_if_changed(app->workspace_title, "Local Linux health");\n',
              '        default:\n            if (app->workspace_icon) {\n                gtk_image_set_from_icon_name(\n                    GTK_IMAGE(app->workspace_icon), "utilities-system-monitor-symbolic", GTK_ICON_SIZE_BUTTON);\n                gtk_image_set_pixel_size(GTK_IMAGE(app->workspace_icon), 30);\n            }\n            label_set_if_changed(app->workspace_title, "Local Linux health");\n',
              'local page icon')

          # Add icon-led footer actions instead of text-only generic buttons.
          helper_anchor = '''static void build_ui(RunnerScopeApp *app)\n{\n'''
          helper = '''static GtkWidget *make_action_button(const char *icon_name,\n                                     const char *label,\n                                     const char *tooltip,\n                                     const char *css_class)\n{\n    GtkWidget *button = gtk_button_new();\n    GtkWidget *row = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 7);\n    GtkWidget *icon =\n        gtk_image_new_from_icon_name(icon_name, GTK_ICON_SIZE_BUTTON);\n    GtkWidget *text = gtk_label_new(label);\n    gtk_image_set_pixel_size(GTK_IMAGE(icon), 18);\n    gtk_widget_set_valign(icon, GTK_ALIGN_CENTER);\n    gtk_widget_set_valign(text, GTK_ALIGN_CENTER);\n    gtk_box_pack_start(GTK_BOX(row), icon, FALSE, FALSE, 0);\n    gtk_box_pack_start(GTK_BOX(row), text, FALSE, FALSE, 0);\n    gtk_container_add(GTK_CONTAINER(button), row);\n    gtk_style_context_add_class(\n        gtk_widget_get_style_context(button), "runner-action-button");\n    if (css_class)\n        gtk_style_context_add_class(\n            gtk_widget_get_style_context(button), css_class);\n    if (tooltip && *tooltip)\n        gtk_widget_set_tooltip_text(button, tooltip);\n    return button;\n}\n\nstatic void build_ui(RunnerScopeApp *app)\n{\n'''
          replace_once(helper_anchor, helper, 'action helper')

          replace_once(
              '    app->open_job_button = gtk_button_new_with_label("Open selected job");\n',
              '    app->open_job_button = make_action_button(\n'
              '        "emblem-web-symbolic", "Open selected job",\n'
              '        "Open the selected workflow job in GitHub.", NULL);\n',
              'open job action')
          replace_once(
              '    app->open_diag_button = gtk_button_new_with_label("Open _diag");\n',
              '    app->open_diag_button = make_action_button(\n'
              '        "folder-open-symbolic", "Open diagnostic",\n'
              '        "Open the selected runner diagnostic.", NULL);\n',
              'open diagnostic action')
          replace_once(
              '    app->restart_button = gtk_button_new_with_label("Restart selected runner");\n',
              '    app->restart_button = make_action_button(\n'
              '        "view-refresh-symbolic", "Restart selected runner",\n'
              '        "Restart the selected local runner service.", "runner-action-warning");\n',
              'restart action')

          replace_once(
              '    GtkWidget *button = gtk_button_new_with_label("Export CSV");\n'
              '    g_signal_connect(button, "clicked", G_CALLBACK(on_export), app);\n'
              '    gtk_box_pack_start(GTK_BOX(general_actions), button, FALSE, FALSE, 0);\n\n'
              '    button = gtk_button_new_with_label("About");\n'
              '    g_signal_connect(button, "clicked", G_CALLBACK(on_about), app);\n'
              '    gtk_box_pack_start(GTK_BOX(general_actions), button, FALSE, FALSE, 0);\n\n'
              '    button = gtk_button_new_with_label("Refresh now");\n'
              '    g_signal_connect(button, "clicked", G_CALLBACK(on_refresh), app);\n'
              '    gtk_box_pack_start(GTK_BOX(general_actions), button, FALSE, FALSE, 0);\n',
              '    GtkWidget *button = make_action_button(\n'
              '        "document-save-symbolic", "Export CSV",\n'
              '        "Export the current workspace as CSV.", NULL);\n'
              '    g_signal_connect(button, "clicked", G_CALLBACK(on_export), app);\n'
              '    gtk_box_pack_start(GTK_BOX(general_actions), button, FALSE, FALSE, 0);\n\n'
              '    button = make_action_button(\n'
              '        "help-about-symbolic", "About",\n'
              '        "About Runner Monitor.", NULL);\n'
              '    g_signal_connect(button, "clicked", G_CALLBACK(on_about), app);\n'
              '    gtk_box_pack_start(GTK_BOX(general_actions), button, FALSE, FALSE, 0);\n\n'
              '    button = make_action_button(\n'
              '        "view-refresh-symbolic", "Refresh now",\n'
              '        "Refresh the active workspace now.", "runner-action-primary");\n'
              '    g_signal_connect(button, "clicked", G_CALLBACK(on_refresh), app);\n'
              '    gtk_box_pack_start(GTK_BOX(general_actions), button, FALSE, FALSE, 0);\n',
              'general actions')

          path.write_text(s)

          version = Path('VERSION')
          if version.read_text().strip() != '1.2.34':
              raise SystemExit('unexpected VERSION before visual recovery')
          version.write_text('1.2.35\n')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          marker = '## Unreleased\n\nNo unreleased changes.\n'
          if marker not in text:
              raise SystemExit('CHANGELOG marker missing')
          text = text.replace(marker, marker + '''\n## 1.2.35 - 2026-10-03\n\n- Restore the graphical Infiltrator OS visual language without reverting the 1.2.27-1.2.34 responsiveness work.\n- Reintroduce deliberate gradients, depth, stronger shaped surfaces, icon wells and accent hierarchy in the header, workspace, navigation, metrics, selection surface and footer.\n- Add a page-identity icon well to the workspace and icon-led footer actions so the application is not dominated by text and flat GTK controls.\n- Keep fixed-height tables, detached model rebuilds, contextual provider scanning and all current performance protections intact.\n- Keep the exact current Infiltratr Common 1.19.38 / 7070c5812b50821fd7580101cb2289a3184f6b2c pin.\n''', 1)
          changelog.write_text(text)

          deb = Path('debian/changelog')
          old = deb.read_text()
          entry = '''infiltrator-runner-monitor (1.2.35) unstable; urgency=medium\n\n  * Restore the graphical Infiltrator OS visual hierarchy while preserving the\n    current responsiveness architecture.\n  * Restore gradients, depth, icon wells, stronger shaped surfaces and\n    graphical action treatment across the native Linux shell.\n  * Add a page-identity icon well and icon-led contextual/footer actions.\n  * Keep the exact current Infiltratr Common 1.19.38 pin.\n\n -- Shannon Smith <infiltratr@yandex.com>  Sat, 03 Oct 2026 15:25:00 +1000\n\n'''
          deb.write_text(entry + old)
          PY

      - name: Build and qualify visual recovery
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          ./build/runnerscope --self-test
          test "$(./build/runnerscope --version)" = "1.2.35"
          test "$(./build/runnerscope --common-version)" = "1.19.38"

      - name: Publish qualified visual recovery source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/runner-monitor-135-visual-recovery.yml
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add -A
          git commit -m "Release 1.2.35: restore Infiltrator OS visual hierarchy"
          git push origin HEAD:main
