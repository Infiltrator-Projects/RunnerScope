name: Apply page transition migration

on:
  push:
    branches:
      - migration/page-transition-1.3.3

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Seed page transition migration'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/page-transition-1.3.3
          fetch-depth: 0

      - name: Apply shared page transition slice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          linux = Path('src/linux_main.c')
          text = linux.read_text()
          replacement = r'''static void on_nav_clicked(GtkButton *button, gpointer user_data)
          {
              RunnerScopeApp *app = user_data;
              if (!app || app->navigation_syncing || !app->notebook) return;

              const gint encoded = GPOINTER_TO_INT(
                  g_object_get_data(G_OBJECT(button), "runner-nav-page"));
              const gint page = encoded - 1;
              if (page < 0 || page >= RUNNER_UI_PAGE_COUNT) return;

              const gint current_page =
                  gtk_notebook_get_current_page(GTK_NOTEBOOK(app->notebook));
              RunnerUiPageTransition transition;
              if (!runner_ui_plan_page_transition(
                      (RunnerUiPageId)current_page,
                      (RunnerUiPageId)page,
                      app->runners_running != 0U,
                      false,
                      &transition) ||
                  !transition.changed)
                  return;

              gtk_notebook_set_current_page(
                  GTK_NOTEBOOK(app->notebook), (gint)transition.requested_page);
              sync_navigation(app, (gint)transition.requested_page);
              render_page(app, (gint)transition.requested_page);
              update_workspace_context(app, (gint)transition.requested_page);
              if (transition.request_activity_refresh)
                  request_activity_refresh(app);
              else if (transition.request_local_refresh)
                  request_local_refresh(app);
              if (transition.clear_selection)
                  clear_selection_card(app);
          }
          '''
          text, n = re.subn(r'static void on_nav_clicked\(GtkButton \*button, gpointer user_data\)\n\{.*?\n\}\n(?=\nstatic GtkWidget \*make_nav_button)', replacement, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'linux navigation callback replacement count={n}')
          linux.write_text(text)

          windows = Path('src/windows_main.c')
          text = windows.read_text()
          replacement = r'''static void set_page(int page)
          {
              if (page < 0 || page >= RUNNER_UI_PAGE_COUNT) return;
              bool runners_running = false;
              for (size_t i = 0U; i < g_row_count; ++i) {
                  if (strcmp(g_rows[i].state, "RUNNING") == 0) {
                      runners_running = true;
                      break;
                  }
              }

              RunnerUiPageTransition transition;
              if (!runner_ui_plan_page_transition(
                      (RunnerUiPageId)g_page,
                      (RunnerUiPageId)page,
                      runners_running,
                      g_table_view,
                      &transition) ||
                  !transition.changed)
                  return;

              g_page = (int)transition.requested_page;
              if (transition.clear_selection) g_selected_row = -1;
              g_card_scroll_y = 0;
              ShowWindow(g_search, transition.show_search ? SW_SHOW : SW_HIDE);
              ShowWindow(g_list, transition.show_runner_table ? SW_SHOW : SW_HIDE);
              update_layout(g_main);
              InvalidateRect(g_main, NULL, FALSE);
          }
          '''
          text, n = re.subn(r'static void set_page\(int page\)\n\{.*?\n\}\n(?=\nstatic void set_table_view)', replacement, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'windows set_page replacement count={n}')
          windows.write_text(text)

          tests = Path('tests/ui_contract_test.c')
          text = tests.read_text()
          if 'verify_page_transition_policy' not in text:
              transition_test = r'''static int verify_page_transition_policy(void)
          {
              RunnerUiPageTransition transition;
              if (!runner_ui_plan_page_transition(
                      RUNNER_UI_PAGE_RUNNERS, RUNNER_UI_PAGE_ACTIVE_JOBS,
                      false, false, &transition))
                  return 1;
              if (!transition.changed || !transition.clear_selection ||
                  !transition.request_activity_refresh ||
                  transition.request_local_refresh || transition.show_search ||
                  transition.show_runner_table)
                  return 2;

              if (!runner_ui_plan_page_transition(
                      RUNNER_UI_PAGE_ACTIVE_JOBS, RUNNER_UI_PAGE_RUNNERS,
                      true, true, &transition))
                  return 3;
              if (!transition.changed || !transition.show_search ||
                  !transition.show_runner_table ||
                  !transition.request_activity_refresh ||
                  transition.request_local_refresh)
                  return 4;

              if (!runner_ui_plan_page_transition(
                      RUNNER_UI_PAGE_HISTORY, RUNNER_UI_PAGE_LOCAL_HEALTH,
                      false, false, &transition))
                  return 5;
              if (!transition.request_local_refresh ||
                  transition.request_activity_refresh)
                  return 6;

              if (!runner_ui_plan_page_transition(
                      RUNNER_UI_PAGE_RUNNERS, RUNNER_UI_PAGE_RUNNERS,
                      true, true, &transition))
                  return 7;
              if (transition.changed || transition.clear_selection ||
                  transition.request_activity_refresh ||
                  transition.request_local_refresh || !transition.show_search ||
                  !transition.show_runner_table)
                  return 8;

              if (runner_ui_plan_page_transition(
                      (RunnerUiPageId)-1, RUNNER_UI_PAGE_RUNNERS,
                      false, false, &transition))
                  return 9;
              if (runner_ui_plan_page_transition(
                      RUNNER_UI_PAGE_RUNNERS, RUNNER_UI_PAGE_COUNT,
                      false, false, &transition))
                  return 10;
              if (runner_ui_plan_page_transition(
                      RUNNER_UI_PAGE_RUNNERS, RUNNER_UI_PAGE_HISTORY,
                      false, false, NULL))
                  return 11;
              return 0;
          }

          '''
              text = text.replace('int main(void)\n{\n', transition_test + 'int main(void)\n{\n', 1)
              text = text.replace('    if (verify_chrome_renderer() != 0) return 16;\n\n', '    if (verify_chrome_renderer() != 0) return 16;\n    if (verify_page_transition_policy() != 0) return 17;\n\n', 1)
              text = text.replace('Runner Monitor shared UI contract, navigation and shell chrome renderers passed.', 'Runner Monitor shared UI contract, navigation, page transitions and shell chrome renderers passed.', 1)
          tests.write_text(text)

          Path('.github/workflows/apply-page-transition-1.3.3.yml').unlink()
          PY

      - name: Commit unified page transition policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git diff --cached --check
          git commit -m 'Unify page transition policy across native shells'
          git push origin HEAD:migration/page-transition-1.3.3
