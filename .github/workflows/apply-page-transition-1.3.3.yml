name: Apply page transition migration

on:
  push:
    branches:
      - migration/page-transition-1.3.3

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Seed page transition migration'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/page-transition-1.3.3
          fetch-depth: 0

      - name: Apply shared page transition slice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          # Shared transition policy contract.
          replace_once('src/ui/ui_renderer.h',
          '''typedef struct {
              const char *status_text;
              const char *app_version;
              const char *common_version;
              bool refreshing;
          } RunnerUiFooterState;
          ''',
          '''typedef struct {
              const char *status_text;
              const char *app_version;
              const char *common_version;
              bool refreshing;
          } RunnerUiFooterState;

          typedef struct {
              RunnerUiPageId current_page;
              RunnerUiPageId requested_page;
              bool changed;
              bool show_search;
              bool show_runner_table;
              bool clear_selection;
              bool request_activity_refresh;
              bool request_local_refresh;
          } RunnerUiPageTransition;
          ''')

          replace_once('src/ui/ui_renderer.h',
          '''bool runner_ui_render_footer(const RunnerUiRenderer *renderer,
                                         const RunnerUiFooterState *state);

          #endif
          ''',
          '''bool runner_ui_render_footer(const RunnerUiRenderer *renderer,
                                         const RunnerUiFooterState *state);
          bool runner_ui_plan_page_transition(RunnerUiPageId current_page,
                                              RunnerUiPageId requested_page,
                                              bool runners_running,
                                              bool table_view,
                                              RunnerUiPageTransition *transition);

          #endif
          ''')

          p = Path('src/ui/ui_renderer.c')
          text = p.read_text()
          marker = '''bool runner_ui_render_footer(const RunnerUiRenderer *renderer,
                                         const RunnerUiFooterState *state)
          {'''
          if marker not in text:
              raise SystemExit('ui_renderer.c footer marker missing')
          if 'runner_ui_plan_page_transition' in text:
              raise SystemExit('page transition policy already present')
          text += '''

          bool runner_ui_plan_page_transition(RunnerUiPageId current_page,
                                              RunnerUiPageId requested_page,
                                              bool runners_running,
                                              bool table_view,
                                              RunnerUiPageTransition *transition)
          {
              if (!transition || (int)current_page < 0 ||
                  current_page >= RUNNER_UI_PAGE_COUNT ||
                  (int)requested_page < 0 || requested_page >= RUNNER_UI_PAGE_COUNT)
                  return false;

              transition->current_page = current_page;
              transition->requested_page = requested_page;
              transition->changed = current_page != requested_page;
              transition->show_search = requested_page == RUNNER_UI_PAGE_RUNNERS;
              transition->show_runner_table =
                  transition->show_search && table_view;
              transition->clear_selection = transition->changed;
              transition->request_activity_refresh =
                  transition->changed &&
                  (requested_page == RUNNER_UI_PAGE_ACTIVE_JOBS ||
                   (requested_page == RUNNER_UI_PAGE_RUNNERS && runners_running));
              transition->request_local_refresh =
                  transition->changed && requested_page == RUNNER_UI_PAGE_LOCAL_HEALTH;
              return true;
          }
          '''
          p.write_text(text)

          # Linux consumes the same page transition plan before applying GTK mechanics.
          replace_once('src/linux_main.c',
          '''static void on_nav_clicked(GtkButton *button, gpointer user_data)
          {
              RunnerScopeApp *app = user_data;
              if (!app || app->navigation_syncing || !app->notebook) return;

              const gint encoded = GPOINTER_TO_INT(
                  g_object_get_data(G_OBJECT(button), "runner-nav-page"));
              const gint page = encoded - 1;
              if (page < 0 || page >= 4) return;

              const gint current_page =
                  gtk_notebook_get_current_page(GTK_NOTEBOOK(app->notebook));
              if (current_page == page) return;

              gtk_notebook_set_current_page(GTK_NOTEBOOK(app->notebook), page);
              sync_navigation(app, page);
              render_page(app, page);
              update_workspace_context(app, page);
              if (page == 1 || (page == 0 && app->runners_running != 0U))
                  request_activity_refresh(app);
              else if (page == 3)
                  request_local_refresh(app);
              clear_selection_card(app);
          }
          ''',
          '''static void on_nav_clicked(GtkButton *button, gpointer user_data)
          {
              RunnerScopeApp *app = user_data;
              if (!app || app->navigation_syncing || !app->notebook) return;

              const gint encoded = GPOINTER_TO_INT(
                  g_object_get_data(G_OBJECT(button), "runner-nav-page"));
              const gint page = encoded - 1;
              if (page < 0 || page >= RUNNER_UI_PAGE_COUNT) return;

              const gint current_page =
                  gtk_notebook_get_current_page(GTK_NOTEBOOK(app->notebook));
              RunnerUiPageTransition transition;
              if (!runner_ui_plan_page_transition(
                      (RunnerUiPageId)current_page,
                      (RunnerUiPageId)page,
                      app->runners_running != 0U,
                      false,
                      &transition) ||
                  !transition.changed)
                  return;

              gtk_notebook_set_current_page(
                  GTK_NOTEBOOK(app->notebook), (gint)transition.requested_page);
              sync_navigation(app, (gint)transition.requested_page);
              render_page(app, (gint)transition.requested_page);
              update_workspace_context(app, (gint)transition.requested_page);
              if (transition.request_activity_refresh)
                  request_activity_refresh(app);
              else if (transition.request_local_refresh)
                  request_local_refresh(app);
              if (transition.clear_selection)
                  clear_selection_card(app);
          }
          ''')

          # Windows consumes the same transition plan before applying Win32 visibility/layout.
          replace_once('src/windows_main.c',
          '''static void set_page(int page)
          {
              if (page < 0 || page >= RUNNER_UI_PAGE_COUNT || page == g_page) return;
              g_page = page;
              g_selected_row = -1;
              g_card_scroll_y = 0;
              ShowWindow(g_search, page == 0 ? SW_SHOW : SW_HIDE);
              ShowWindow(g_list, page == 0 && g_table_view ? SW_SHOW : SW_HIDE);
              update_layout(g_main);
              InvalidateRect(g_main, NULL, FALSE);
          }
          ''',
          '''static void set_page(int page)
          {
              if (page < 0 || page >= RUNNER_UI_PAGE_COUNT) return;
              bool runners_running = false;
              for (size_t i = 0U; i < g_row_count; ++i) {
                  if (strcmp(g_rows[i].state, "RUNNING") == 0) {
                      runners_running = true;
                      break;
                  }
              }

              RunnerUiPageTransition transition;
              if (!runner_ui_plan_page_transition(
                      (RunnerUiPageId)g_page,
                      (RunnerUiPageId)page,
                      runners_running,
                      g_table_view,
                      &transition) ||
                  !transition.changed)
                  return;

              g_page = (int)transition.requested_page;
              if (transition.clear_selection) g_selected_row = -1;
              g_card_scroll_y = 0;
              ShowWindow(g_search, transition.show_search ? SW_SHOW : SW_HIDE);
              ShowWindow(g_list, transition.show_runner_table ? SW_SHOW : SW_HIDE);
              update_layout(g_main);
              InvalidateRect(g_main, NULL, FALSE);
          }
          ''')

          # Toolkit-free policy tests make page-switch semantics a single executable contract.
          replace_once('tests/ui_contract_test.c',
          '''int main(void)
          {
          ''',
          '''static int verify_page_transition_policy(void)
          {
              RunnerUiPageTransition transition;
              if (!runner_ui_plan_page_transition(
                      RUNNER_UI_PAGE_RUNNERS, RUNNER_UI_PAGE_ACTIVE_JOBS,
                      false, false, &transition))
                  return 1;
              if (!transition.changed || !transition.clear_selection ||
                  !transition.request_activity_refresh ||
                  transition.request_local_refresh || transition.show_search ||
                  transition.show_runner_table)
                  return 2;

              if (!runner_ui_plan_page_transition(
                      RUNNER_UI_PAGE_ACTIVE_JOBS, RUNNER_UI_PAGE_RUNNERS,
                      true, true, &transition))
                  return 3;
              if (!transition.changed || !transition.show_search ||
                  !transition.show_runner_table ||
                  !transition.request_activity_refresh ||
                  transition.request_local_refresh)
                  return 4;

              if (!runner_ui_plan_page_transition(
                      RUNNER_UI_PAGE_HISTORY, RUNNER_UI_PAGE_LOCAL_HEALTH,
                      false, false, &transition))
                  return 5;
              if (!transition.request_local_refresh ||
                  transition.request_activity_refresh)
                  return 6;

              if (!runner_ui_plan_page_transition(
                      RUNNER_UI_PAGE_RUNNERS, RUNNER_UI_PAGE_RUNNERS,
                      true, true, &transition))
                  return 7;
              if (transition.changed || transition.clear_selection ||
                  transition.request_activity_refresh ||
                  transition.request_local_refresh || !transition.show_search ||
                  !transition.show_runner_table)
                  return 8;

              if (runner_ui_plan_page_transition(
                      (RunnerUiPageId)-1, RUNNER_UI_PAGE_RUNNERS,
                      false, false, &transition))
                  return 9;
              if (runner_ui_plan_page_transition(
                      RUNNER_UI_PAGE_RUNNERS, RUNNER_UI_PAGE_COUNT,
                      false, false, &transition))
                  return 10;
              if (runner_ui_plan_page_transition(
                      RUNNER_UI_PAGE_RUNNERS, RUNNER_UI_PAGE_HISTORY,
                      false, false, NULL))
                  return 11;
              return 0;
          }

          int main(void)
          {
          ''')

          replace_once('tests/ui_contract_test.c',
          '''    if (verify_chrome_renderer() != 0) return 16;

              puts("Runner Monitor shared UI contract, navigation and shell chrome renderers passed.");
              return 0;
          }
          ''',
          '''    if (verify_chrome_renderer() != 0) return 16;
              if (verify_page_transition_policy() != 0) return 17;

              puts("Runner Monitor shared UI contract, navigation, page transitions and shell chrome renderers passed.");
              return 0;
          }
          ''')

          # Keep migration plumbing out of the resulting branch.
          Path('.github/workflows/apply-page-transition-1.3.3.yml').unlink()
          PY

      - name: Commit unified page transition policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git diff --cached --check
          git commit -m 'Unify page transition policy across native shells'
          git push origin HEAD:migration/page-transition-1.3.3
