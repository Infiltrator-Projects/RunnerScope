name: Runner Monitor 1.2.31 forensic cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner-monitor-131-forensic-fix.yml'

permissions:
  contents: write

concurrency:
  group: runner-monitor-131-forensic-cleanup
  cancel-in-progress: false

jobs:
  qualify-and-publish-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source and Common
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify latest Common
        shell: bash
        run: |
          set -euo pipefail
          latest_common="$(git ls-remote https://github.com/Infiltrator-Projects/Infiltrator-Libraries.git refs/heads/main | awk '{print $1}')"
          pinned_common="$(git ls-tree HEAD infiltratr-common | awk '{print $3}')"
          test -n "$latest_common"
          test "$pinned_common" = "$latest_common"
          test "$pinned_common" = '7070c5812b50821fd7580101cb2289a3184f6b2c'
          test "$(tr -d '[:space:]' < infiltratr-common/VERSION)" = '1.19.38'
          grep -F 'RUNNERSCOPE_COMMON_EXPECTED_VERSION "1.19.38"' CMakeLists.txt >/dev/null
          grep -F 'RUNNERSCOPE_COMMON_EXPECTED_COMMIT "7070c5812b50821fd7580101cb2289a3184f6b2c"' CMakeLists.txt >/dev/null

      - name: Apply forensic responsiveness and shell cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/forensic_fix_131.py
          python3 tools/forensic_fix_131_retry.py
          test "$(tr -d '[:space:]' < VERSION)" = '1.2.31'
          grep -F 'RUNNERSCOPE_MAIN_NAV_WIDTH 195' src/linux_main.c >/dev/null
          grep -F 'RUNNERSCOPE_MAIN_NAV_COMPACT_WIDTH 64' src/linux_main.c >/dev/null
          grep -F 'RUNNERSCOPE_MAIN_NAV_BUTTON_HEIGHT 50' src/linux_main.c >/dev/null
          grep -F 'gtk_search_entry_new()' src/linux_main.c >/dev/null
          grep -F 'initial_activity_refresh_cb' src/linux_main.c >/dev/null
          grep -F 'restart_worker' src/linux_main.c >/dev/null
          ! grep -F 'GtkListBox' src/linux_main.c
          ! grep -F 'GtkRadioButton' src/linux_main.c
          ! grep -F 'runner-nav-list' src/linux_main.c
          ! grep -F 'runner-menubar' src/linux_main.c
          ! grep -F '.page-header' src/linux_main.c
          git diff --check

      - name: Build and qualify refreshed Linux source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev
          cmake -S . -B /tmp/runnerscope-131 -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/runnerscope-131 --parallel
          ctest --test-dir /tmp/runnerscope-131 --output-on-failure
          /tmp/runnerscope-131/runnerscope --self-test
          test "$(/tmp/runnerscope-131/runnerscope --common-version)" = '1.19.38'

      - name: Publish qualified release source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git rm .github/workflows/runner-monitor-131-forensic-fix.yml tools/forensic_fix_131.py tools/forensic_fix_131_retry.py
          git add src/linux_main.c VERSION CHANGELOG.md debian/changelog
          git diff --cached --check
          git commit -m 'Release 1.2.31: forensic responsiveness and Infiltrator OS shell'
          git push origin HEAD:main
