name: Runner Monitor 1.2.30 forensic fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner-monitor-130-forensic-fix.yml'

permissions:
  contents: write

jobs:
  qualify-and-publish-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source and Common
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify latest Common and transform source
        shell: bash
        run: |
          set -euo pipefail
          latest_common="$(git ls-remote https://github.com/Infiltrator-Projects/Infiltrator-Libraries.git refs/heads/main | awk '{print $1}')"
          pinned_common="$(git ls-tree HEAD infiltratr-common | awk '{print $3}')"
          test -n "$latest_common"
          test "$pinned_common" = "$latest_common"
          test "$(tr -d '[:space:]' < infiltratr-common/VERSION)" = '1.19.38'
          grep -F 'RUNNERSCOPE_COMMON_EXPECTED_VERSION "1.19.38"' CMakeLists.txt >/dev/null
          grep -F 'RUNNERSCOPE_COMMON_EXPECTED_COMMIT "7070c5812b50821fd7580101cb2289a3184f6b2c"' CMakeLists.txt >/dev/null
          python3 -m py_compile tools/forensic_fix_130.py
          python3 tools/forensic_fix_130.py
          test "$(tr -d '[:space:]' < VERSION)" = '1.2.30'
          grep -F '#runner-main-nav-button' src/linux_main.c >/dev/null
          grep -F 'runner_row_by_name' src/linux_main.c >/dev/null
          grep -F 'activity_row_by_url' src/linux_main.c >/dev/null
          ! grep -F 'runner-nav-list' src/linux_main.c
          ! grep -F 'make_nav_row' src/linux_main.c
          git diff --check

      - name: Build and qualify refreshed Linux source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev
          cmake -S . -B /tmp/runnerscope-130 -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/runnerscope-130 --parallel
          ctest --test-dir /tmp/runnerscope-130 --output-on-failure
          /tmp/runnerscope-130/runnerscope --self-test
          test "$(/tmp/runnerscope-130/runnerscope --common-version)" = '1.19.38'

      - name: Publish qualified release source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git rm .github/workflows/runner-monitor-130-forensic-fix.yml tools/forensic_fix_130.py
          git add src/linux_main.c VERSION CHANGELOG.md debian/changelog
          git diff --cached --check
          git commit -m 'Release 1.2.30: finish responsive Infiltrator OS shell'
          git push origin HEAD:main
