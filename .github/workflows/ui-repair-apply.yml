# SPDX-License-Identifier: GPL-3.0-or-later
name: Apply Runner Monitor UI repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ui-repair-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Reuse reviewed repair payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/ui-repair.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end]) + '\n'
          Path('/tmp/runner-ui-repair.py').write_text(body)
          PY
          python3 /tmp/runner-ui-repair.py
          # The reviewed payload also proposes CI checks. Leave workflow changes
          # to the GitHub connector, because GITHUB_TOKEN may not mutate workflows.
          git checkout -- .github/workflows/ci.yml
      - name: Commit repaired product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Runner Monitor repair"
          git config user.email "actions@users.noreply.github.com"
          git add src/linux_main.c CMakeLists.txt debian docs/DESIGN.md assets/art
          git diff --cached --check
          git commit -m "Restore graphical Infiltrator OS UI contract"
          git push origin HEAD:main
