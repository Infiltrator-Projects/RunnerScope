              ('app->selection_card = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 12);',
               'app->selection_card = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, (gint)control_spacing);'),
              ('GtkWidget *footer = gtk_box_new(GTK_ORIENTATION_VERTICAL, 7);',
               'GtkWidget *footer = gtk_box_new(GTK_ORIENTATION_VERTICAL, (gint)compact_spacing);'),
              ('GtkWidget *action_row = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 10);',
               'GtkWidget *action_row = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, (gint)control_spacing);'),
              ('GtkWidget *context_actions = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 6);',
               'GtkWidget *context_actions = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, (gint)compact_spacing);'),
              ('GtkWidget *general_actions = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 6);',
               'GtkWidget *general_actions = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, (gint)compact_spacing);'),
              ('GtkWidget *status_row = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 12);',
               'GtkWidget *status_row = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, (gint)control_spacing);'),
          ]
          for old, new in layout_replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'layout replacement failed: {old}')
              source = source.replace(old, new, 1)

          source = source.replace(
              '''    /*
               * The old row of tiny status pills made every datum look equally
               * unimportant.  This hero surface gives fleet state a single visual anchor.
               */''',
              '''    /* Fleet state is grouped into one primary summary surface. */''', 1)
          source = source.replace(
              '''    /*
               * GtkNotebook's vertical custom tabs can lose or clip their child widgets
               * under some GTK themes/scaling combinations. Keep GtkNotebook as the page
               * host and use a compact GtkListBox rail for stable, readable navigation.
               *
               * Keep exactly one width constraint on the navigation rail.  Combining
               * CSS and widget minimums can make GTK reserve duplicate horizontal space.
               */''',
              '''    /* GtkNotebook remains the page host; the left rail owns navigation. */''', 1)

          once(
              '''    if (app->local_thread) {
                  g_thread_join(app->local_thread);
                  app->local_thread = NULL;
              }
              g_hash_table_unref(app->sessions);''',
              '''    if (app->local_thread) {
                  g_thread_join(app->local_thread);
                  app->local_thread = NULL;
              }
              if (app->theme_provider) {
                  GdkScreen *screen = gdk_screen_get_default();
                  if (screen) {
                      gtk_style_context_remove_provider_for_screen(
                          screen, GTK_STYLE_PROVIDER(app->theme_provider));
                  }
                  g_clear_object(&app->theme_provider);
              }
              g_hash_table_unref(app->sessions);''',
              'theme provider cleanup')

          source_path.write_text(source)

          cmake = Path('CMakeLists.txt').read_text()
          cmake = cmake.replace(
              'set(RUNNERSCOPE_COMMON_EXPECTED_VERSION "1.19.35")',
              'set(RUNNERSCOPE_COMMON_EXPECTED_VERSION "1.19.38")')
          cmake = cmake.replace(
              'set(RUNNERSCOPE_COMMON_EXPECTED_COMMIT "7cc5de3de0e94ed2cfcff0840bbb5346eb5c9c9f")',
              'set(RUNNERSCOPE_COMMON_EXPECTED_COMMIT "7070c5812b50821fd7580101cb2289a3184f6b2c")')
          if '1.19.35' in cmake or '7cc5de3de0e94ed2cfcff0840bbb5346eb5c9c9f' in cmake:
              raise SystemExit('old Common pin remains in CMakeLists.txt')
          Path('CMakeLists.txt').write_text(cmake)

          readme = Path('README.md').read_text().replace('Common 1.19.35', 'Common 1.19.38')
          Path('README.md').write_text(readme)

          design = Path('docs/DESIGN.md').read_text()
          marker = '## Infiltrator OS shell\n'
          if marker not in design:
              design += '''

          ## Infiltrator OS shell

          The Linux shell consumes the current Common semantic palette, typography and
          design metrics directly. Screen/content spacing, panel/card/control radii,
          titlebar chrome, navigation selection, buttons, tooltips and detail surfaces
          follow that contract rather than maintaining a second private geometry system.

          Repeated telemetry updates must update only visible/time-dependent cells. Theme
          changes reuse one CSS provider; background provider and service work stays off
          the GTK main thread.
          '''
          Path('docs/DESIGN.md').write_text(design)

          Path('VERSION').write_text('1.2.28\n')

          changelog = Path('CHANGELOG.md').read_text()
          anchor = '## Unreleased\n\nNo unreleased changes.\n'
          release = '''## Unreleased

          No unreleased changes.

          ## 1.2.28 - 2026-10-03

          - Align the Linux shell with the current Infiltrator OS titlebar, navigation, semantic palette and Common design metrics.
          - Reuse one GTK CSS provider instead of stacking a new provider after each theme change.
          - Update only the visible live table on one-second ticks and only rebuild provider-backed models when their page is visible.
          - Avoid no-op label invalidation for counters, summary and workspace metrics.
          - Restore the suite-standard 1280x800 desktop geometry and 214 px navigation rail.
          - Remove retired BigBedroom routing/probe artifacts from the Runner Monitor repository.
          - Advance the pinned Infiltratr Common dependency from 1.19.35 to current 1.19.38.
          '''
          if anchor not in changelog:
              raise SystemExit('CHANGELOG Unreleased anchor missing')
          changelog = changelog.replace(anchor, release, 1)
          Path('CHANGELOG.md').write_text(changelog)

          debian = Path('debian/changelog').read_text()
          entry = '''infiltrator-runner-monitor (1.2.28) unstable; urgency=medium

            * Align the Linux shell with current Infiltrator OS chrome, semantic colour
              roles and Common design metrics.
            * Reuse one GTK CSS provider and avoid repeated style-provider accumulation.
            * Update only visible live tables and suppress no-op label redraws.
            * Remove retired BigBedroom routing/probe repository artifacts.
            * Update the pinned Infiltratr Common dependency to 1.19.38.

           -- Shannon Smith <infiltratr@yandex.com>  Sat, 03 Oct 2026 10:20:00 +1000

          '''
          Path('debian/changelog').write_text(entry + debian)
          PY

          git -C infiltratr-common fetch origin main
          git -C infiltratr-common checkout 7070c5812b50821fd7580101cb2289a3184f6b2c

          rm -f .github/workflows/bigbedroom-linux-prerequisites.yml
          rm -f tools/prefer-bigbedroom-runners.sh

          if grep -R -n --exclude-dir=.git --exclude-dir=infiltratr-common \
              -E '1\.19\.35|7cc5de3de0e94ed2cfcff0840bbb5346eb5c9c9f|runnerscope-firstparty|src/native2' \
              CMakeLists.txt README.md docs .github debian src tools 2>/dev/null; then
            echo 'Retired implementation/Common references remain.' >&2
            exit 1
          fi

      - name: Build and qualify refreshed source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev
          cmake -S . -B build-forensic -DCMAKE_BUILD_TYPE=Release
          cmake --build build-forensic --parallel
          ctest --test-dir build-forensic --output-on-failure
          ./build-forensic/runnerscope --self-test
          test "$(./build-forensic/runnerscope --common-version)" = '1.19.38'

      - name: Commit qualified release and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/forensic-refresh.yml
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git diff --cached --check
          git commit -m 'Release 1.2.28: forensic performance and Infiltrator OS alignment'
          git push origin HEAD:main
