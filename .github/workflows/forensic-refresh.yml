              label_set_if_changed(app->counter_labels[index], text);
          }''',
              'counter stack formatting')

          once(
              '    gtk_label_set_text(GTK_LABEL(app->summary_label), summary);\n',
              '    label_set_if_changed(app->summary_label, summary);\n',
              'summary no-op update')

          for old, new in [
              ('gtk_label_set_text(GTK_LABEL(app->workspace_title), "Runner fleet");',
               'label_set_if_changed(app->workspace_title, "Runner fleet");'),
              ('gtk_label_set_text(GTK_LABEL(app->workspace_title), "Active work");',
               'label_set_if_changed(app->workspace_title, "Active work");'),
              ('gtk_label_set_text(GTK_LABEL(app->workspace_title), "Session history");',
               'label_set_if_changed(app->workspace_title, "Session history");'),
              ('gtk_label_set_text(GTK_LABEL(app->workspace_title), "Local Linux health");',
               'label_set_if_changed(app->workspace_title, "Local Linux health");'),
          ]:
              if source.count(old) != 1:
                  raise SystemExit(f'workspace title replacement failed: {old}')
              source = source.replace(old, new, 1)

          subtitle_pairs = [
              ('gtk_label_set_text(\n                GTK_LABEL(app->workspace_subtitle),\n                "Capacity, state changes, workload ownership and utilisation across every self-hosted runner.");',
               'label_set_if_changed(\n                app->workspace_subtitle,\n                "Capacity, state changes, workload ownership and utilisation across every self-hosted runner.");'),
              ('gtk_label_set_text(\n                GTK_LABEL(app->workspace_subtitle),\n                "Live workflow execution across local self-hosted capacity and GitHub-hosted jobs.");',
               'label_set_if_changed(\n                app->workspace_subtitle,\n                "Live workflow execution across local self-hosted capacity and GitHub-hosted jobs.");'),
              ('gtk_label_set_text(\n                GTK_LABEL(app->workspace_subtitle),\n                "State transitions and work observed by this monitor session.");',
               'label_set_if_changed(\n                app->workspace_subtitle,\n                "State transitions and work observed by this monitor session.");'),
              ('gtk_label_set_text(\n                GTK_LABEL(app->workspace_subtitle),\n                "Installed runner services, process identity, GitHub linkage and latest diagnostic evidence.");',
               'label_set_if_changed(\n                app->workspace_subtitle,\n                "Installed runner services, process identity, GitHub linkage and latest diagnostic evidence.");'),
          ]
          for old, new in subtitle_pairs:
              if source.count(old) != 1:
                  raise SystemExit('workspace subtitle replacement failed')
              source = source.replace(old, new, 1)

          once(
              '''    render_runners(app);
              render_history(app);
              update_summary(app);''',
              '''    const gint page =
                  gtk_notebook_get_current_page(GTK_NOTEBOOK(app->notebook));
              if (page == 0)
                  render_runners(app);
              else if (page == 2)
                  render_history(app);
              update_summary(app);''',
              'runner refresh visible-page rendering')

          once(
              '''    app->queued = result->queued;
              render_activity(app);
              update_summary(app);''',
              '''    app->queued = result->queued;
              if (gtk_notebook_get_current_page(GTK_NOTEBOOK(app->notebook)) == 1)
                  render_activity(app);
              update_summary(app);''',
              'activity refresh visible-page rendering')

          once(
              '''        g_ptr_array_add(app->local_rows, row);
              }
              render_local(app);
              g_ptr_array_unref(result->rows);''',
              '''        g_ptr_array_add(app->local_rows, row);
              }
              if (gtk_notebook_get_current_page(GTK_NOTEBOOK(app->notebook)) == 3)
                  render_local(app);
              g_ptr_array_unref(result->rows);''',
              'local refresh visible-page rendering')

          once(
              '''    refresh_runner_clock_cells(app, monotonic_now, wall_now);
              refresh_activity_clock_cells(app, wall_now);
              update_summary(app);''',
              '''    const gint page =
                  gtk_notebook_get_current_page(GTK_NOTEBOOK(app->notebook));
              if (page == 0)
                  refresh_runner_clock_cells(app, monotonic_now, wall_now);
              else if (page == 1)
                  refresh_activity_clock_cells(app, wall_now);
              update_summary(app);''',
