name: Apply runner card renderer migration

on:
  push:
    branches:
      - migration/ui-runner-cards-1.3.5

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run runner card renderer migration'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: migration/ui-runner-cards-1.3.5
          fetch-depth: 0

      - name: Apply runner cards/details unification slice
        run: python3 tools/apply_runner_cards_renderer_migration.py

      - name: Commit migrated runner card adapters
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git diff --cached --check
          git commit -m 'Unify runner cards and selection details through native renderers'
          git push origin HEAD:migration/ui-runner-cards-1.3.5
