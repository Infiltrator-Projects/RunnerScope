name: Apply 1.3.1 release

on:
  push:
    branches:
      - release/1.3.1

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Seed 1.3.1 release'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/1.3.1
          fetch-depth: 0

      - name: Apply release metadata
        run: python3 tools/apply_release_1_3_1.py

      - name: Commit release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git diff --cached --check
          git commit -m 'Release 1.3.1'
          git push origin HEAD:release/1.3.1
