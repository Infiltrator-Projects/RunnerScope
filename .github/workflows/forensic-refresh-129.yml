# SPDX-License-Identifier: GPL-3.0-or-later
name: Runner Monitor 1.2.29 forensic refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/forensic-refresh-129.yml

permissions:
  contents: write

jobs:
  qualify-and-publish-source:
    if: github.event.head_commit.message == 'Run forensic refresh 1.2.29'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact source and Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify latest Common and apply forensic refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/forensic_refresh_129.py
          latest_common="$(git ls-remote https://github.com/Infiltrator-Projects/Infiltrator-Libraries.git refs/heads/main | awk '{print $1}')"
          pinned_common="$(git ls-tree HEAD infiltratr-common | awk '{print $3}')"
          test -n "$latest_common"
          test "$pinned_common" = "$latest_common"
          test "$(tr -d '[:space:]' < infiltratr-common/VERSION)" = '1.19.38'
          python3 tools/forensic_refresh_129.py
          test "$(tr -d '[:space:]' < VERSION)" = '1.2.29'
          grep -F 'RUNNERSCOPE_COMMON_EXPECTED_VERSION "1.19.38"' CMakeLists.txt >/dev/null
          grep -F 'RUNNERSCOPE_COMMON_EXPECTED_COMMIT "7070c5812b50821fd7580101cb2289a3184f6b2c"' CMakeLists.txt >/dev/null
          ! grep -F 'Current Infiltrator OS/Common shell projection' src/linux_main.c
          ! grep -F 'make_tab_label' src/linux_main.c
          ! grep -F 'static void rgb_text' src/linux_main.c
          grep -F 'make_nav_content' src/linux_main.c >/dev/null
          grep -F 'activity_rows_static_equal' src/linux_main.c >/dev/null
          grep -F 'local_rows_equal' src/linux_main.c >/dev/null
          git diff --check

      - name: Build and qualify refreshed Linux source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev
          cmake -S . -B /tmp/runnerscope-129 -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/runnerscope-129 --parallel
          ctest --test-dir /tmp/runnerscope-129 --output-on-failure
          /tmp/runnerscope-129/runnerscope --self-test
          test "$(/tmp/runnerscope-129/runnerscope --common-version)" = '1.19.38'

      - name: Publish qualified release source
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/forensic_refresh_129.py .github/workflows/forensic-refresh-129.yml
          rm -rf tools/__pycache__
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git diff --cached --check
          git commit -m 'Release 1.2.29: streamline refresh and align Infiltrator OS shell'
          git push origin HEAD:main
