name: Apply Runner Monitor 1.3.3 release

on:
  push:
    branches: ["release/1.3.3"]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message == 'Seed 1.3.3 release' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/1.3.3
          fetch-depth: 0
      - name: Apply release metadata
        run: python3 tools/apply_release_1_3_3.py
      - name: Commit release candidate
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git diff --cached --check
          git commit -m 'Release 1.3.3'
          git push origin HEAD:release/1.3.3
