# SPDX-License-Identifier: GPL-3.0-or-later
name: Repair forensic refresh workflow

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-forensic-refresh.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Fix forensic refresh'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Repair guard and retrigger forensic refresh
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s|readme = Path('README.md').read_text().replace('Common 1.19.35', 'Common 1.19.38')|readme = Path('README.md').read_text().replace('Common 1.19.35', 'Common 1.19.38').replace('7cc5de3de0e94ed2cfcff0840bbb5346eb5c9c9f', '7070c5812b50821fd7580101cb2289a3184f6b2c')|" .github/workflows/forensic-refresh.yml
          sed -i 's|CMakeLists.txt README.md docs .github debian src tools|CMakeLists.txt README.md docs src tools|' .github/workflows/forensic-refresh.yml
          sed -i 's|Retired implementation/Common references remain.|Retired live implementation/Common references remain.|' .github/workflows/forensic-refresh.yml
          grep -F "7070c5812b50821fd7580101cb2289a3184f6b2c')" .github/workflows/forensic-refresh.yml >/dev/null
          grep -F 'CMakeLists.txt README.md docs src tools' .github/workflows/forensic-refresh.yml >/dev/null
          rm -f .github/workflows/fix-forensic-refresh.yml
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git diff --cached --check
          git commit -m 'Run forensic refresh'
          git push origin HEAD:main
