name: Fix workspace summary migration CI

on:
  push:
    branches:
      - migration/ui-workspace-summary-1.3.4

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Seed workspace summary CI fix'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: migration/ui-workspace-summary-1.3.4
          fetch-depth: 0

      - name: Remove obsolete initial page local
        shell: bash
        run: |
          set -euo pipefail
          perl -0pi -e 's/    const RunnerUiPageSpec \*initial_page =\n        runner_ui_page\(RUNNER_UI_PAGE_RUNNERS\);\n//' src/linux_main.c
          rm .github/workflows/fix-workspace-summary-1.3.4.yml
          git diff --check

      - name: Commit CI repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git commit -m 'Remove obsolete initial workspace local'
          git push origin HEAD:migration/ui-workspace-summary-1.3.4
