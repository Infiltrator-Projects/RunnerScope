name: Runner Monitor 1.2.32 forensic cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner-monitor-132-forensic-fix.yml'

permissions:
  contents: write

concurrency:
  group: runner-monitor-132-forensic-cleanup
  cancel-in-progress: false

jobs:
  qualify-and-publish-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source and Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify latest Common
        shell: bash
        run: |
          set -euo pipefail
          latest_common="$(git ls-remote https://github.com/Infiltrator-Projects/Infiltrator-Libraries.git refs/heads/main | awk '{print $1}')"
          pinned_common="$(git ls-tree HEAD infiltratr-common | awk '{print $3}')"
          test -n "$latest_common"
          test "$pinned_common" = "$latest_common"
          test "$pinned_common" = '7070c5812b50821fd7580101cb2289a3184f6b2c'
          test "$(tr -d '[:space:]' < infiltratr-common/VERSION)" = '1.19.38'
          grep -F 'RUNNERSCOPE_COMMON_EXPECTED_VERSION "1.19.38"' CMakeLists.txt >/dev/null
          grep -F 'RUNNERSCOPE_COMMON_EXPECTED_COMMIT "7070c5812b50821fd7580101cb2289a3184f6b2c"' CMakeLists.txt >/dev/null

      - name: Apply forensic responsiveness and shell cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/forensic_fix_132.py
          sed -i 's/GtkWidget \*settings = make_window_control(/GtkWidget *settings_button = make_window_control(/' src/linux_main.c
          sed -i 's/g_signal_connect(settings, "clicked", G_CALLBACK(on_settings), app);/g_signal_connect(settings_button, "clicked", G_CALLBACK(on_settings), app);/' src/linux_main.c
          sed -i 's/gtk_box_pack_start(GTK_BOX(header_end), settings, FALSE, FALSE, 0);/gtk_box_pack_start(GTK_BOX(header_end), settings_button, FALSE, FALSE, 0);/' src/linux_main.c
          test "$(tr -d '[:space:]' < VERSION)" = '1.2.32'
          grep -F 'preferences-system-symbolic", "Settings"' src/linux_main.c >/dev/null
          grep -F 'g_timeout_add_seconds(2U, tick_timer_cb, app)' src/linux_main.c >/dev/null
          grep -F 'config->runner_poll_seconds = 3U' src/linux_main.c >/dev/null
          grep -F 'config->local_health_seconds = 15U' src/linux_main.c >/dev/null
          grep -F 'gtk_notebook_get_current_page(GTK_NOTEBOOK(app->notebook)) == 3' src/linux_main.c >/dev/null
          ! grep -F 'RUNNERSCOPE_SUMMARY_TICK_INTERVAL' src/linux_main.c
          ! grep -F 'initial_local_refresh_cb' src/linux_main.c
          ! grep -F 'initial_local_timer' src/linux_main.c
          ! grep -F 'menu menuitem' src/linux_main.c
          ! grep -F 'gtk_button_new_with_label("Settings")' src/linux_main.c
          ! grep -F 'GtkListBox' src/linux_main.c
          ! grep -F 'GtkRadioButton' src/linux_main.c
          ! grep -F 'runner-menubar' src/linux_main.c
          ! grep -F '.page-header' src/linux_main.c
          git diff --check

      - name: Build and qualify refreshed Linux source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev
          cmake -S . -B /tmp/runnerscope-132 -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/runnerscope-132 --parallel
          ctest --test-dir /tmp/runnerscope-132 --output-on-failure
          /tmp/runnerscope-132/runnerscope --self-test
          test "$(/tmp/runnerscope-132/runnerscope --common-version)" = '1.19.38'

      - name: Publish qualified release source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git rm .github/workflows/runner-monitor-132-forensic-fix.yml tools/forensic_fix_132.py
          git add src/linux_main.c src/windows_main.c VERSION CHANGELOG.md debian/changelog
          git diff --cached --check
          git commit -m 'Release 1.2.32: reduce refresh churn and finish shell cleanup'
          git push origin HEAD:main
