# SPDX-License-Identifier: GPL-3.0-or-later
name: RunnerScope CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-package:
    name: Linux package / installed runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source and Common gitlink
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build and runtime qualification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ca-certificates cmake debhelper devscripts fontconfig git \
            pkg-config libgtk-3-dev libcurl4-openssl-dev xvfb xauth

      - name: Verify exact Common checkout
        shell: bash
        run: |
          set -euo pipefail
          expected_common="$(git rev-parse HEAD:infiltratr-common)"
          actual_common="$(git -C infiltratr-common rev-parse HEAD)"
          test -n "$expected_common"
          test "$actual_common" = "$expected_common"
          test -n "$(tr -d '[:space:]' < infiltratr-common/VERSION)"

      - name: Build and test Debian package
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "$(dpkg-parsechangelog -SVersion)" = "$version"
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          deb="$(find .. -maxdepth 1 -name "runnerscope_${version}_*.deb" -print -quit)"
          test -n "$deb"
          cp "$deb" "dist/runnerscope_${version}_amd64.deb"
          dpkg-deb --info "dist/runnerscope_${version}_amd64.deb"
          ! dpkg-deb -f "dist/runnerscope_${version}_amd64.deb" Depends | grep -Eiq 'python|tkinter|python3-tk|(^|[ ,])gh([ ,(]|$)'

      - name: Build exact hardware-native installer launcher
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          installer="dist/runnerscope-${version}-native-installer.run"
          support/installer/make-run.sh "$installer"
          test -x "$installer"
          "$installer" --help | grep -Fq 'native CPU tuning + LTO + trained two-pass PGO'
          grep -Fq "source_revision='${GITHUB_SHA}'" "$installer"
          common_revision="$(git rev-parse HEAD:infiltratr-common)"
          grep -Fq "common_revision='${common_revision}'" "$installer"

      - name: Install and smoke exact package
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          sudo apt-get install -y "./dist/runnerscope_${version}_amd64.deb"
          cmp build-debian/github-sign-in/gh_2.102.0_linux_amd64/bin/gh /usr/libexec/runnerscope/gh
          runnerscope --self-test
          XDG_CONFIG_HOME="$RUNNER_TEMP/runner-ui-config" \
          XDG_STATE_HOME="$RUNNER_TEMP/runner-ui-state" \
            xvfb-run -a runnerscope --ui-self-test
          file /usr/bin/runnerscope | grep -q ELF
          ! ldd /usr/bin/runnerscope | grep -Eiq 'python|libtk|tkinter'
          test -f /usr/share/applications/runnerscope.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/runnerscope.svg
          test -f /usr/share/icons/hicolor/128x128/apps/runnerscope.png
          test -f /usr/share/fonts/truetype/runnerscope/mb_corpo_a_cond_regular.ttf
          test -f /usr/share/fonts/truetype/runnerscope/mb_corpo_s_bold.ttf
          test -f /usr/share/fonts/truetype/runnerscope/mb_corpo_s_regular.ttf
          for asset in nav-runners nav-active nav-history nav-health nav-infiltrator \
                       hero-runners hero-active hero-history hero-health; do
            test -s "/usr/share/runnerscope/art/${asset}.png"
            gdk-pixbuf-thumbnailer -s 64 "/usr/share/runnerscope/art/${asset}.png" \
              "$RUNNER_TEMP/${asset}.png"
          done
          fc-match "MB Corpo S Title WEB" | grep -qi 'MB Corpo'
          fc-match "MB Corpo A Title Cond WEB" | grep -qi 'MB Corpo'
          grep -qx 'Exec=/usr/bin/runnerscope' /usr/share/applications/runnerscope.desktop
          ! test -e /usr/lib/runnerscope/runnerscope.py

      - name: Upload qualified Linux release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runnerscope-linux
          path: |
            dist/runnerscope_*.deb
            dist/runnerscope-*-native-installer.run
          if-no-files-found: error

      - name: Purge package cleanly
        if: always()
        run: |
          if dpkg-query -W runnerscope >/dev/null 2>&1; then
            sudo apt-get purge -y runnerscope
          fi

  native-installer:
    name: Hardware-native .run / clean-host qualification
    needs: linux-package
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Download exact Linux release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runnerscope-linux
          path: dist

      - name: Compile, package and install through the exact .run
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t installers < <(find dist -maxdepth 1 -type f -name 'runnerscope-*-native-installer.run' -print | sort)
          test "${#installers[@]}" -eq 1
          installer="${installers[0]}"
          chmod +x "$installer"
          "$installer" --help | grep -Fq 'native CPU tuning + LTO + trained two-pass PGO'
          sudo "$installer" --system-package-mode --jobs 2
          version="$(basename "$installer" | sed -E 's/^runnerscope-([0-9]+\.[0-9]+\.[0-9]+)-native-installer\.run$/\1/')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(dpkg-query -W -f='${Status}' runnerscope)" = 'install ok installed'
          test "$(dpkg-query -W -f='${Version}' runnerscope)" = "$version"
          runnerscope --self-test
          XDG_CONFIG_HOME="$RUNNER_TEMP/native-ui-config" \
          XDG_STATE_HOME="$RUNNER_TEMP/native-ui-state" \
            xvfb-run -a runnerscope --ui-self-test
          file /usr/bin/runnerscope | grep -q ELF
          ! ldd /usr/bin/runnerscope | grep -Eiq 'python|libtk|tkinter'

      - name: Purge native package cleanly
        if: always()
        run: |
          if dpkg-query -W runnerscope >/dev/null 2>&1; then
            sudo apt-get purge -y runnerscope
          fi

  windows-release:
    name: Windows x64 build / runtime / artifact
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out exact source and Common gitlink
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify exact Common checkout
        shell: powershell
        run: |
          $expected = (git rev-parse HEAD:infiltratr-common).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = (git -C infiltratr-common rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!$expected -or $expected -ne $actual) {
            throw "Common checkout does not match the repository gitlink"
          }

      - name: Build and execute exact Windows release binary
        shell: powershell
        run: |
          cmake -S . -B build -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exe = ".\build\Release\RunnerScope.exe"
          if (!(Test-Path $exe)) { throw "Native x64 EXE missing" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) {
            throw ("Expected AMD64 PE machine 0x8664, got 0x{0:X4}" -f $machine)
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe ".\dist\RunnerScope-Windows.exe"

      - name: Upload qualified Windows executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runnerscope-windows
          path: dist/RunnerScope-Windows.exe
          if-no-files-found: error

  release-state:
    name: Release state invariant
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.state.outputs.publish }}
      version: ${{ steps.state.outputs.version }}
    steps:
      - name: Check out exact main state and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Enforce VERSION / tag / release authority
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/${tag}^{commit}" >/dev/null; then
            tagged="$(git rev-parse "refs/tags/${tag}^{commit}")"
            if [[ "$tagged" != "$GITHUB_SHA" ]]; then
              echo "VERSION ${version} is already released from ${tagged}; main is ${GITHUB_SHA}. Bump VERSION before changing main." >&2
              exit 1
            fi
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish qualified release
    needs: [linux-package, native-installer, windows-release, release-state]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-state.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download qualified Linux artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runnerscope-linux
          path: release/linux

      - name: Download qualified Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runnerscope-windows
          path: release/windows

      - name: Publish immutable release from qualified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.release-state.outputs.version }}"
          tag="v${version}"
          deb="$(find release/linux -type f -name 'runnerscope_*.deb' -print -quit)"
          installer="$(find release/linux -type f -name 'runnerscope-*-native-installer.run' -print -quit)"
          win="release/windows/RunnerScope-Windows.exe"
          test -f "$deb"
          test -x "$installer"
          test -f "$win"
          "$installer" --help | grep -Fq 'native CPU tuning + LTO + trained two-pass PGO'

          win_release="release/RunnerScope-Windows-v${version}.exe"
          installer_release="release/runnerscope-${version}-native-installer.run"
          cp "$win" "$win_release"
          cp "$deb" "release/$(basename "$deb")"
          cp "$installer" "$installer_release"
          chmod +x "$installer_release"
          deb_release="release/$(basename "$deb")"
          (
            cd release
            sha256sum "$(basename "$deb_release")" "$(basename "$installer_release")" \
              "$(basename "$win_release")" > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
            ! grep -qE '  .*/' SHA256SUMS.txt
          )

          if ! gh release view "$tag" --json isDraft,targetCommitish > "$RUNNER_TEMP/release-state"; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft \
              --title "RunnerScope $version" \
              --notes "Exact Linux package, aggressive native installer and Windows binary qualified from $GITHUB_SHA."
            gh release view "$tag" --json isDraft,targetCommitish > "$RUNNER_TEMP/release-state"
          fi
          test "$(jq -r .targetCommitish "$RUNNER_TEMP/release-state")" = "$GITHUB_SHA"
          draft=$(jq -r .isDraft "$RUNNER_TEMP/release-state")
          if [[ "$draft" == true ]]; then
            gh release upload "$tag" "$deb_release" "$installer_release" "$win_release" release/SHA256SUMS.txt --clobber
          fi
          verify_remote() {
            local destination expected
            destination=$(mktemp -d)
            gh release download "$tag" --dir "$destination"
            expected=$(printf '%s\n' "$(basename "$deb_release")" \
              "$(basename "$installer_release")" "$(basename "$win_release")" SHA256SUMS.txt | sort)
            test "$(find "$destination" -type f -printf '%f\n' | sort)" = "$expected"
            cmp "$deb_release" "$destination/$(basename "$deb_release")"
            cmp "$installer_release" "$destination/$(basename "$installer_release")"
            cmp "$win_release" "$destination/$(basename "$win_release")"
            cmp release/SHA256SUMS.txt "$destination/SHA256SUMS.txt"
            rm -rf "$destination"
          }
          verify_remote
          if [[ "$draft" == true ]]; then
            gh release edit "$tag" --draft=false --latest
          fi
          verify_remote
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"

  apt-publication:
    name: Verify published APT update
    needs: [publish, release-state]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.release-state.result == 'success' &&
      (needs.publish.result == 'success' ||
       (needs.publish.result == 'skipped' && needs.release-state.outputs.publish == 'false'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require the qualified release in the live APT repository
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-state.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://infiltrator-projects.github.io/Infiltrator-Repository
          ASSET="runnerscope_${VERSION}_amd64.deb"
          digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" \
            --jq ".assets[] | select(.name == \"$ASSET\") | .digest")"
          expected="${digest#sha256:}"
          [[ "$expected" =~ ^[a-f0-9]{64}$ ]]
          # The distribution repository owns its pull/dispatch publication.
          # Release CI is not complete until that publication is actually live.
          for attempt in $(seq 1 100); do
            ready=true
            for channel in beta alpha; do
              index="$RUNNER_TEMP/apt-$channel-Packages"
              if ! curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' \
                "$BASE/dists/$channel/main/binary-amd64/Packages?release=$VERSION" > "$index"; then
                ready=false
                continue
              fi
              stanza="$(awk -v version="$VERSION" 'BEGIN { RS="" }
                index("\n" $0 "\n", "\nPackage: runnerscope\n") &&
                index("\n" $0 "\n", "\nVersion: " version "\n") { print }' "$index")"
              if ! grep -Fqx "SHA256: $expected" <<< "$stanza" ||
                 ! grep -Fqx "Filename: pool/main/$ASSET" <<< "$stanza"; then
                ready=false
              fi
            done
            if [[ "$ready" == true ]]; then
              curl -fsSL --retry 3 --max-time 30 "$BASE/pool/main/$ASSET" -o "$RUNNER_TEMP/apt-update.deb"
              printf '%s  %s\n' "$expected" "$RUNNER_TEMP/apt-update.deb" | sha256sum --check
              printf 'RunnerScope %s is live in beta and alpha APT, with the qualified release digest.\n' "$VERSION"
              exit 0
            fi
            echo "Waiting for APT publication of $VERSION ($attempt/100)…"
            sleep 15
          done
          echo "GitHub release exists, but APT publication is incomplete." >&2
          exit 1
