# SPDX-License-Identifier: GPL-3.0-or-later
name: Runner Monitor CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-native:
    name: Linux native C/Common
    runs-on: [self-hosted, Linux, X64, linux-native]
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Check out Runner Monitor and pinned Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install native build dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ca-certificates cmake fontconfig pkg-config libgtk-3-dev

      - name: Verify self-hosted native dependencies
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          for command_name in cc c++ make cmake ctest pkg-config; do
            command -v "$command_name" >/dev/null 2>&1 || {
              echo "Self-hosted runner is missing $command_name." >&2
              exit 1
            }
          done
          pkg-config --exists gtk+-3.0

      - name: Verify exact Common gitlink
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(tr -d '[:space:]' < infiltratr-common/VERSION)"
          expected_common="$(git ls-tree HEAD infiltratr-common | awk '{print $3}')"
          test -n "$expected_common"
          test "$(git -C infiltratr-common rev-parse HEAD)" = "$expected_common"

      - name: Build and test native Linux application
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          ./build/runnerscope --self-test
          file ./build/runnerscope | grep -q ELF
          ! ldd ./build/runnerscope | grep -Eiq 'python|libtk|tkinter'
          ! find . -maxdepth 1 -type f -name 'runnerscope*.py' -print -quit | grep -q .

  windows-native:
    name: Windows native C/Common EXE
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    env:
      PSExecutionPolicyPreference: RemoteSigned
    steps:
      - name: Discover Windows build tools and Git Bash
        if: runner.os == 'Windows' && runner.environment == 'self-hosted'
        shell: powershell
        run: |
          $git = (Get-Command git.exe -ErrorAction Stop).Source
          $gitRoot = Split-Path (Split-Path $git -Parent) -Parent
          $dirs = @((Join-Path $gitRoot 'bin'), (Join-Path $gitRoot 'usr\bin'), (Join-Path $env:ProgramFiles 'CMake\bin'))
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -products '*' -property installationPath
            if ($vs) { $dirs += Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin' }
          }
          foreach ($dir in $dirs) {
            if (Test-Path $dir) {
              $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              $env:PATH = "$dir;$env:PATH"
            }
          }
          Get-ExecutionPolicy -List
          cmake --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check out Runner Monitor and pinned Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build and run native ARM64 qualification binary
        shell: powershell
        run: |
          # The self-hosted Windows pool is ARM64. Run the behavioural/resource
          # self-test as a native ARM64 process so Windows does not block an x64
          # executable under this runner service account.
          cmake -S . -B build-arm64 -A ARM64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-arm64 --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-arm64 -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ".\build-arm64\Release\Runner-Monitor.exe" --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build x64 release executable
        shell: powershell
        run: |
          # The distributed Windows artifact remains x64. Cross-build it on the
          # ARM64 runner, then verify its PE machine type rather than attempting
          # to execute an x64 process in the restricted runner service context.
          cmake -S . -B build-x64 -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-x64 --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = ".\build-x64\Release\Runner-Monitor.exe"
          if (!(Test-Path $exe)) { throw "Native x64 EXE missing" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) {
            throw ("Expected AMD64 PE machine 0x8664, got 0x{0:X4}" -f $machine)
          }

      - name: Stage Windows executable
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item ".\build-x64\Release\Runner-Monitor.exe" ".\dist\Runner-Monitor-Windows.exe"

      - name: Upload qualified Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: runner-monitor-windows
          path: dist/Runner-Monitor-Windows.exe
          if-no-files-found: error

  clean-package-install:
    name: Hosted clean native Debian build / install
    needs: linux-native
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source and pinned Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install clean package build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential ca-certificates cmake debhelper devscripts fontconfig git pkg-config             libgtk-3-dev gh xvfb xauth

      - name: Verify exact Common pin
        shell: bash
        run: |
          set -euo pipefail
          expected_common="$(git ls-tree HEAD infiltratr-common | awk '{print $3}')"
          test -n "$expected_common"
          test "$(git -C infiltratr-common rev-parse HEAD)" = "$expected_common"

      - name: Build native Debian package
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          deb="$(find .. -maxdepth 1 -name "infiltrator-runner-monitor_${version}_*.deb" -print -quit)"
          test -n "$deb"
          cp "$deb" "dist/runnerscope_${version}_amd64.deb"
          dpkg-deb --info "dist/runnerscope_${version}_amd64.deb"
          dpkg-deb --contents "dist/runnerscope_${version}_amd64.deb"
          ! dpkg-deb -f "dist/runnerscope_${version}_amd64.deb" Depends | grep -Eiq 'python|tkinter|python3-tk'

      - name: Install exact native package
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          sudo apt-get install -y "./dist/runnerscope_${version}_amd64.deb"

      - name: Smoke installed native application
        shell: bash
        run: |
          set -euo pipefail
          runnerscope --self-test
          XDG_CONFIG_HOME="$RUNNER_TEMP/runner-ui-config" \
          XDG_STATE_HOME="$RUNNER_TEMP/runner-ui-state" \
          xvfb-run -a runnerscope --ui-self-test
          file /usr/bin/runnerscope | grep -q ELF
          test -f /usr/share/applications/runnerscope.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/runnerscope.svg
          test -f /usr/share/icons/hicolor/128x128/apps/runnerscope.png
          test -f /usr/share/fonts/truetype/runnerscope/mb_corpo_a_cond_regular.ttf
          test -f /usr/share/fonts/truetype/runnerscope/mb_corpo_s_bold.ttf
          test -f /usr/share/fonts/truetype/runnerscope/mb_corpo_s_regular.ttf
          for asset in nav-runners nav-active nav-history nav-health nav-infiltrator \
                       hero-runners hero-active hero-history hero-health; do
            test -s "/usr/share/runnerscope/art/${asset}.png"
            gdk-pixbuf-thumbnailer -s 64 "/usr/share/runnerscope/art/${asset}.png" \
              "$RUNNER_TEMP/${asset}.png"
          done
          fc-match "MB Corpo S Title WEB" | grep -qi 'MB Corpo'
          fc-match "MB Corpo A Title Cond WEB" | grep -qi 'MB Corpo'
          grep -qx 'Exec=/usr/bin/runnerscope' /usr/share/applications/runnerscope.desktop
          ! test -e /usr/lib/runnerscope/runnerscope.py

      - name: Upload qualified Debian package
        uses: actions/upload-artifact@v4
        with:
          name: runnerscope-deb
          path: dist/runnerscope_*.deb
          if-no-files-found: error

      - name: Purge package cleanly
        run: |
          sudo apt-get purge -y infiltrator-runner-monitor
          ! dpkg-query -W infiltrator-runner-monitor >/dev/null 2>&1
