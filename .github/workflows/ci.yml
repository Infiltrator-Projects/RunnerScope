# SPDX-License-Identifier: GPL-3.0-or-later
name: Runner Monitor CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runnerscope-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-linux:
    name: Hosted Linux build / test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Runner Monitor and pinned Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3 python3-tk

      - name: Verify build dependencies
        shell: bash
        run: |
          set -euo pipefail
          for command_name in cmake gcc make python3; do
            command -v "$command_name" >/dev/null 2>&1 || {
              echo "Hosted runner is missing $command_name." >&2
              exit 1
            }
          done
          test "$(tr -d '[:space:]' < infiltratr-common/VERSION)" = "1.19.10"
          test "$(git -C infiltratr-common rev-parse HEAD)" = "33e69c0a462b56d388881d89c4eb49f72fa0b0fe"

      - name: Enforce first-party native boundary
        run: ./tools/check-first-party-native.sh

      - name: Build native bridge and first-party core
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          ./build/runnerscope-firstparty-core --self-test

      - name: Run native and Python contracts
        run: |
          python3 tests/test_native_bridge.py ./build/runnerscope-native
          python3 tests/test_ui_contract.py
          python3 tests/test_python_logic.py
          python3 -m py_compile runnerscope.py runnerscope_linux.py runnerscope_windows.py

  windows-python:
    name: Hosted Windows compatibility contracts
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out Runner Monitor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Windows Python contracts
        shell: pwsh
        run: |
          python --version
          python tests/test_python_logic.py
          python runnerscope.py --self-test
          python -m py_compile runnerscope.py runnerscope_linux.py runnerscope_windows.py

  clean-package-install:
    name: Hosted clean Debian build / install
    needs: local-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source and pinned Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install clean package build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake debhelper devscripts git \
            python3 python3-tk

      - name: Verify exact Common pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < infiltratr-common/VERSION)" = "1.19.10"
          test "$(git -C infiltratr-common rev-parse HEAD)" = "33e69c0a462b56d388881d89c4eb49f72fa0b0fe"

      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          cp ../infiltrator-runner-monitor_1.1.10_*.deb dist/runnerscope_1.1.10_amd64.deb
          dpkg-deb --info dist/runnerscope_1.1.10_*.deb
          dpkg-deb --contents dist/runnerscope_1.1.10_*.deb

      - name: Install exact package
        run: sudo apt-get install -y ./dist/runnerscope_1.1.10_*.deb

      - name: Smoke installed native and Python boundaries
        run: |
          /usr/lib/runnerscope/runnerscope-native --self-test
          runnerscope --self-test
          test -f /usr/share/applications/runnerscope.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/runnerscope.svg
          test -f /usr/share/icons/hicolor/128x128/apps/runnerscope.png
          test -f /usr/share/app-install/icons/infiltrator-runner-monitor.png
          grep -qx 'Icon=runnerscope' /usr/share/applications/runnerscope.desktop
          grep -qx 'StartupWMClass=RunnerScope' /usr/share/applications/runnerscope.desktop

      - name: Upload qualified Debian package
        uses: actions/upload-artifact@v4
        with:
          name: runnerscope-deb
          path: dist/runnerscope_1.1.10_*.deb
          if-no-files-found: error

      - name: Purge package cleanly
        run: |
          sudo apt-get purge -y infiltrator-runner-monitor
          ! dpkg-query -W infiltrator-runner-monitor >/dev/null 2>&1
